[project]
name = "valvur"
version = "0.2.0"
description = "Fully offline security scanner for AI-generated code. Your source never leaves your machine."
readme = "README.md"
# 3.11+: tomllib is stdlib from 3.11, and the shim is stdlib-only by design
# (F10.6), so depending on tomli would cost us that property.
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [{name = "MaverickHQ"}]
dependencies = []          # host shim is stdlib-only by design (F10.6)

[project.scripts]
valvur = "valvur.cli:main"
# MCP is the primary interface (ADR-0015); no extra to opt into.
"valvur-mcp" = "valvur.mcp.server:main"

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.11", "jsonschema>=4"]

[build-system]
# Bounded, not open (19.A.1). uv.lock pins the dev tooling, but a build backend is
# resolved outside the lock at build time — so an unqualified "hatchling" means a
# hatchling 2.0 could change the wheel this repository produces with no commit here.
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/valvur"]

[tool.hatch.build.hooks.custom]
# hatch_build.py: writes valvur/_build.py — the tree hash this wheel was built
# beside — into the wheel, and nowhere else (task 23.4.4).
path = "hatch_build.py"

[tool.hatch.build.targets.sdist]
# Tests carry deliberately planted credentials and an injection payload — that is
# their purpose. Publishing them would distribute fake AWS keys and a prompt-injection
# string to PyPI, trip every downstream secret scanner, and look absurd coming from a
# tool that detects exactly those things. Packagers who want the tests can use the
# repository.
exclude = [
  "/tests",
  "/.github",
  "/.kiro",
  "/docs",
  "/scripts",
  "/.gitleaks.toml",
  "/.githooks",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["e2e: requires a real container runtime"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
# A security tool should run security lints on itself.
# S = flake8-bandit. We preach it, so we practise it.
select = ["E", "F", "I", "UP", "B", "S", "RUF"]

[tool.ruff.lint.per-file-ignores]
# Tests deliberately handle planted credentials and invoke subprocesses.
# S105/S106/S107: test helpers carry the planted credential as a default.
"tests/*" = ["S101", "S105", "S106", "S107", "S603", "S607"]
# Fixture workspaces are deliberately insecure — that is their entire purpose.
"tests/fixtures/*" = ["ALL"]
# S607: this script invokes the container runtime by name on purpose. Hard-coding an
# absolute path would break every machine whose Docker lives somewhere else, and the
# calls use argument-list form with no shell.
# S607: these invoke git and the container runtime by name on purpose.
"scripts/*" = ["S607"]
"src/valvur/gitcontext.py" = ["S607"]
