# Labels for the Score's real-code precision track (R9.5, ADR-0026).
#
# Every active finding of a rule valvur owns, or of Gitleaks, on the corpus at its
# pins: `tp` when a maintainer would act on it (change code, rotate, pin), `fp`
# otherwise, and why. The executor's judgement, 2026-09-29, read against the code at
# each finding; committed for the owner to read and overrule. A finding with no
# label here fails the track. Coverage notes are valvur's own limits, not judged.
#
# R20 (D47, D56), 2026-10-03: the sink inventory is no longer judged, being reported
# for review and never active, and the vendored `random` rule is not reported where
# docs live; their ten labels went with them. The secrets in tests and docs rank
# `low` now and are still judged, as false alarms.
#
# R29.2 (D65a), 2026-10-04: the corpus widened to forty-eight projects, and every active
# finding on the thirty-five new ones is labelled below, read against the code at each.
# Nine more were valvur's own false positives, and were fixed rather than labelled: npm
# aliases, three licence readings, and RegExp's exec read as a shell (R29.2's fixes).

