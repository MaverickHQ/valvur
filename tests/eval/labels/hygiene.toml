# Labels for Checkov's and zizmor's Findings on the corpus (R48.3, D82a, D82b).
#
# These are judged in a table of their own, `hygiene`, and are never pooled into the
# real-code track. A rule with more than 25 Findings on the corpus is judged on the 25 with
# the lowest Fingerprints; the labels below are those, and every Finding of a smaller rule.
#
# `tp` when the property the rule names holds in that file and a maintainer of the project
# would not call the report wrong; `fp` otherwise. The executor's judgement, 2026-11-22,
# read against each file at the project's pinned commit; committed for the owner to read
# and overrule. Three readings are applied the same way throughout:
#
# - A Dockerfile's missing HEALTHCHECK or USER is true for an image that serves, an example
#   included, and false for a container that builds, tests or is a base for others.
# - A dangerous trigger is true where the privileged run consumes what a contributor
#   controls (the pull request's code, or an artifact built from it) or trusts a check that
#   can be spoofed, and false where it acts only on labels, titles, comments or merged work.
# - A template expansion is false where only someone with write access sets the value.
#
# A label whose verdict changes needs `changed = "<date>: <reason>"`: the baseline records
# every verdict, and `tests/test_eval_hygiene.py` compares.

