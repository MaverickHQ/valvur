# The external sources the Score reads (ADR-0026, N4.4), each pinned by commit.
# Each is fetched into the build cache by `scripts/eval.py` and never vendored: a
# checkout at any other commit is refused.

[owasp-benchmark-python]
url = "https://github.com/OWASP-Benchmark/BenchmarkPython"
commit = "f1291485808b66e20ddb6b01b10dc71b3df8c8ba"
licence = "GPL-3.0"

# R13 (D29, ADR-0029): candidate static-analysis rules for Python, JavaScript, Go and
# Java. MIT, but most rules translate another project's checks; each rule's origin
# and both licences are in `tests/eval/sast-rules.json`, and only a rule whose file
# and origin are both permissive may be vendored.
[gitlab-sast-rules]
url = "https://gitlab.com/gitlab-org/security-products/sast-rules"
commit = "53bf5cf6df3c51b6c02110f5a638b5e6213666cd"
licence = "MIT"

# R41 (D80): track 9's real cases, the vulnerable code of published advisories in LLM
# frameworks, each read from GitHub's advisory database. `commit` is the vulnerable
# release's; `fixed` is given only where the fix removes the flow. `files` hold the flow,
# which in each crosses a function, class or module (R41.1). PandasAI's CVE-2024-12366
# is left out: its repository's licence reads NOASSERTION.
[llm-output-real.langchain-math]
url = "https://github.com/langchain-ai/langchain"
licence = "MIT"
advisory = "CVE-2023-29374"
category = "code-execution"
