# The public corpus (task 22.E.1): twelve real repositories, pinned, scanned weekly.
#
# The local corpus found three false positives in an hour — two introduced by the
# block before, with every test green — and was then deleted because it held private
# repositories and a live credential. This is its public replacement. Everything here
# is permissively licensed, fetched at the pinned commit by `scripts/corpus.py fetch`
# into `tests/corpus/.checkouts/` (ignored by git and by the self-scan), and judged by
# `scripts/corpus.py run` against the 19.F.5 conditions:
#
#   1. no Scanner failed                      (`complete` is true)
#   2. every omission is named               (an ecosystem valvur cannot read produces
#                                              its coverage note; nothing is silent)
#   3. no confusing status                    (`inconclusive` only with a stated doubt;
#                                              `clean` only with nothing active)
#   4. no false positive from valvur itself   (no real dependency of a maintained
#                                              project reported nonexistent or as a
#                                              near-miss; no agent file of a maintained
#                                              project reported as an injection unless
#                                              a reviewer agreed and wrote it down here)
#
# Pinned by commit, not branch, so a run is reproducible and a failure is ours. Bump a
# pin deliberately, and say what changed. The bytes are not committed: twelve real
# projects are tens of megabytes of someone else's code in our history forever, and
# every self-scan would have to exclude them. The pins and the expectations are the
# corpus; the bytes follow from the pins.

