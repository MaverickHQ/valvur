# Planted for R4.2: an unpinned action, write-all permissions and a template
# injection, each of which zizmor must report once. And for R4.5, two that must not
# be reported as unpinned: an action pinned to a full commit SHA, and a local one.
name: planted
on:
  issues:
    types: [opened]
permissions: write-all
jobs:
  triage:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
      - uses: ./.github/actions/local
      - run: echo "${{ github.event.issue.title }}"
