# Standard identifiers, mapped (R51.2, D82o, ADR-0037).
#
# A rule is mapped to its CWE and to OWASP's lists at the editions named below, each read
# from OWASP's own pages on the day it says. Looked up by the rule's ID, then the longest
# prefix, then the Scanner, then the Finding Class. `owasp = "none"` needs a `reason`.
#
# *Mapped to* is the whole claim. An entry says where a Finding sorts in a taxonomy other
# tools and auditors use. It does not say valvur covers the category, and nothing valvur
# writes says so. The categories no entry maps to are listed in docs/OWASP-MAPPING.md.
#
# Every rule and Check valvur writes or vendors has an entry by ID, which
# tests/test_identifiers.py holds against the rule files and the source. Gitleaks',
# Checkov's and zizmor's rules cannot be listed from this repository: each Scanner has
# one entry. A dependency vulnerability takes the CWE its advisory gives.

[list.top10]
name = "OWASP Top 10"
edition = "2025"
read = 2026-11-23
source = "https://top10.owasp.org/2025/"
categories = { "A01:2025" = "Broken Access Control", "A02:2025" = "Security Misconfiguration", "A03:2025" = "Software Supply Chain Failures", "A04:2025" = "Cryptographic Failures", "A05:2025" = "Injection", "A06:2025" = "Insecure Design", "A07:2025" = "Authentication Failures", "A08:2025" = "Software or Data Integrity Failures", "A09:2025" = "Security Logging and Alerting Failures", "A10:2025" = "Mishandling of Exceptional Conditions" }

[list.llm]
name = "OWASP Top 10 for LLM Applications"
edition = "2025"
read = 2026-11-23
source = "https://genai.owasp.org/llm-top-10/"
categories = { "LLM01:2025" = "Prompt Injection", "LLM02:2025" = "Sensitive Information Disclosure", "LLM03:2025" = "Supply Chain", "LLM04:2025" = "Data and Model Poisoning", "LLM05:2025" = "Improper Output Handling", "LLM06:2025" = "Excessive Agency", "LLM07:2025" = "System Prompt Leakage", "LLM08:2025" = "Vector and Embedding Weaknesses", "LLM09:2025" = "Misinformation", "LLM10:2025" = "Unbounded Consumption" }

[list.agentic]
name = "OWASP Top 10 for Agentic Applications"
edition = "2026"
read = 2026-11-23
source = "https://genai.owasp.org/resource/owasp-top-10-for-agentic-applications-for-2026/"
categories = { "ASI01" = "Agent Goal Hijack", "ASI02" = "Tool Misuse and Exploitation", "ASI03" = "Identity and Privilege Abuse", "ASI04" = "Agentic Supply Chain Vulnerabilities", "ASI05" = "Unexpected Code Execution", "ASI06" = "Memory & Context Poisoning", "ASI07" = "Insecure Inter-Agent Communication", "ASI08" = "Cascading Failures", "ASI09" = "Human-Agent Trust Exploitation", "ASI10" = "Rogue Agents" }

[list.agentic-threats]
name = "Agentic AI: Threats and Mitigations"
edition = "1.1"
read = 2026-11-23
source = "https://genai.owasp.org/resource/agentic-ai-threats-and-mitigations/"
mapped = false
reason = "Read and not mapped to: the Top 10 for Agentic Applications is the list OWASP publishes to be cited, and of its threats T1 to T17 the name of T14 could not be read from the document."

# A CWE to the Top 10 category whose own List of Mapped CWEs holds it, read from each
# category's page. A dependency vulnerability's CWE, which its advisory gives, is looked up
# here. CWE-1321 is in none of the ten lists.
