name: valvur's version
description: >-
  The version this tree declares, read from pyproject.toml: the one place every
  workflow reads it (D55c). Needs the repository checked out.
outputs:
  version:
    description: The version, X.Y.Z
    value: ${{ steps.read.outputs.version }}
runs:
  using: composite
  steps:
    - id: read
      shell: bash
      run: |
        set -eu
        version=$(grep -m1 '^version' pyproject.toml | cut -d'"' -f2)
        test -n "$version"
        echo "version=$version" >> "$GITHUB_OUTPUT"
