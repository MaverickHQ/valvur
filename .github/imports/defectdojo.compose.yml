# DefectDojo, as its own docker-compose.yml at 3.5.202 starts it, less what a measurement
# does not need: the scheduler, the TLS port, and the bind mount for settings overrides
# (R51.5, D82p). Every image is pinned by digest. Its two keys are made by whoever starts
# it, for that run, and passed in the environment: none is written here. The instance lives
# for one measurement, on localhost, and holds nothing but a scan of a test fixture.
name: valvur-imports-defectdojo

x-django: &django
  image: registry.defectdojo.com/defectdojo/defectdojo-django:3.5.202@sha256:7f905b5f2c40e4de0394a9d382102a54c0f08ee435d2fc9c7e267e86839fd965
  environment: &django-env
    DD_DEBUG: "False"
    DD_ALLOWED_HOSTS: "*"
    DD_DATABASE_URL: postgresql://defectdojo:defectdojo@postgres:5432/defectdojo
    DD_CELERY_BROKER_URL: redis://valkey:6379/0
    DD_CACHE_URL: redis://valkey:6379/1
    DD_SECRET_KEY: "${DD_SECRET_KEY:?made for this run by whoever starts it}"
    DD_CREDENTIAL_AES_256_KEY: "${DD_CREDENTIAL_AES_256_KEY:?32 characters, made for this run}"
    DD_DATABASE_READINESS_TIMEOUT: "30"

services:
  nginx:
    image: registry.defectdojo.com/defectdojo/defectdojo-nginx:3.5.202@sha256:27540c8a846975a6f106b133f8dd5d50dc2a5808df96e36d55b46f01dd2c8d78
    depends_on:
      uwsgi:
        condition: service_started
    environment:
      NGINX_METRICS_ENABLED: "false"
      DD_UWSGI_HOST: uwsgi
      DD_UWSGI_PORT: "3031"
    volumes:
      - media:/usr/share/nginx/html/media
    ports:
      - "127.0.0.1:8080:8080"

  uwsgi:
    <<: *django
    depends_on: &ready
      initializer:
        condition: service_completed_successfully
      postgres:
        condition: service_started
      valkey:
        condition: service_started
    entrypoint: ["/wait-for-it.sh", "postgres:5432", "-t", "30", "--", "/entrypoint-uwsgi.sh"]
    volumes:
      - media:/app/media

  celeryworker:
    <<: *django
    depends_on: *ready
    entrypoint: ["/wait-for-it.sh", "postgres:5432", "-t", "30", "--",
                 "/entrypoint-celery-worker.sh"]
    volumes:
      - media:/app/media

  initializer:
    <<: *django
    depends_on:
      postgres:
        condition: service_started
    entrypoint: ["/wait-for-it.sh", "postgres:5432", "--", "/entrypoint-initializer.sh"]
    environment:
      <<: *django-env
      DD_ADMIN_USER: admin
      DD_ADMIN_MAIL: admin@defectdojo.local
      DD_ADMIN_FIRST_NAME: Admin
      DD_ADMIN_LAST_NAME: User
      DD_INITIALIZE: "true"

  postgres:
    image: postgres:18.6-alpine@sha256:9ba53c7d41ea093baf5c1ba635ba5434c4f979880527d49bb7d9237d3193085b
    environment:
      PGDATA: /var/lib/postgresql/data
      POSTGRES_DB: defectdojo
      POSTGRES_USER: defectdojo
      POSTGRES_PASSWORD: defectdojo
    volumes:
      - postgres:/var/lib/postgresql/data

  valkey:
    image: valkey/valkey:9.1.2-alpine@sha256:48332870af354a799964c0012ae1194a0bf2bf894eb508f945810596dc2d8d11

volumes:
  media: {}
  postgres: {}
