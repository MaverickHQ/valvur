# We report unpinned and outdated dependencies in other people's repositories.
# Not tracking our own would be the first thing a reviewer notices — the same
# reasoning that made us fix CKV2_GHA_1 in this repo an hour after reporting it
# in someone else's.
#
# Actions are pinned to commit SHAs, which is what makes Dependabot necessary here
# rather than optional: a pinned SHA never moves on its own, so security updates
# arrive only if something opens the pull request.
#
# A week's cooldown on version updates: a release withdrawn within days, the usual
# shape of a compromised one, never reaches a pull request here. Security updates
# are not delayed by it.
version: 2

updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: "chore"
    labels: ["dependencies", "supply-chain"]
    groups:
      # One pull request rather than four. These are all first-party or
      # well-known actions; reviewing them together is honest, and a flood of
      # individual PRs is how dependency updates start getting rubber-stamped.
      actions:
        patterns: ["*"]

  - package-ecosystem: uv
    # `uv`, not `pip`, since 19.A.1: the resolution now lives in a committed uv.lock
    # and CI installs it with --frozen. Pointing Dependabot at pyproject.toml would
    # bump the declared ranges and leave the lock — the thing actually installed —
    # untouched, so nothing would reach CI.
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: "chore"
    labels: ["dependencies"]
    groups:
      dev-dependencies:
        # Runtime dependencies are deliberately zero (ADR-0015), so in practice
        # everything here is tooling. Grouped, but security updates still arrive
        # on their own so they are not buried.
        patterns: ["*"]
        applies-to: version-updates

  - package-ecosystem: pip
    # The Checkov lock (23.4.1): `requirements-checkov.txt`, every transitive
    # package pinned by version and hash. Dependabot rewrites the hashes with the
    # version; CI rebuilds the image from the lock and the e2e suite runs Checkov.
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: "chore"
    labels: ["dependencies", "supply-chain"]
    groups:
      checkov:
        patterns: ["*"]

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: "chore"
    labels: ["dependencies", "supply-chain"]
    ignore:
      # The image installs valvur into Python 3.12's own site-packages and compiles
      # it there, so a new Python is a deliberate change, not a bump: #154 (3.12 to
      # 3.14) failed e2e, the self-scan and the reproducible build. A new digest of
      # the same Python still arrives, as the security fix it usually is.
      - dependency-name: "python"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
