name: eval

# The Score on Linux (task R9.6, ADR-0026): every track scanned by the image built
# from this tree, scored by the OWASP Benchmark's formula, and compared with the
# committed baseline. Weekly, on dispatch, and on a PR that changes the harness,
# since GitHub dispatches only a workflow already on the default branch and the
# first run is the PR that adds it. It is the Linux half of every phase's exit
# (tasks.md §4); the Mac half runs by hand on the build machine.
on:
  schedule:
    - cron: "47 4 * * 1"     # Mondays, 04:47 UTC
  workflow_dispatch:
  pull_request:
    paths:
      - "scripts/eval.py"
      - "scripts/eval/**"
      - "tests/eval/**"
      - "rules/**"
      - ".github/workflows/eval.yml"

permissions:
  contents: read

jobs:
  score:
    name: the Score, every track
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      issues: write         # open the one issue a failure gets (27.2.7)
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - id: version
        uses: ./.github/actions/version
      - name: Build the image from this tree
        env:
          VER: ${{ steps.version.outputs.version }}
        run: |
          SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)" \
            VALVUR_VERSION="$VER" docker buildx bake dev \
              --set '*.cache-from=type=gha' --set '*.cache-to=type=gha,mode=max'
      - run: uv venv --python 3.12
      - run: uv sync --extra dev --locked

      - name: Fetch the vulnerability database and the name index
        env:
          VALVUR_IMAGE: valvur:dev
        run: uv run valvur update

      - name: The Score, compared with the baseline when there is one
        env:
          VALVUR_IMAGE: valvur:dev
        run: |
          set -o pipefail
          compare=()
          if [ -f tests/eval/baseline.json ]; then
            compare=(--compare tests/eval/baseline.json)
          fi
          uv run python scripts/eval.py --work "$RUNNER_TEMP/eval" --out eval-report \
            "${compare[@]}"

      - name: Summary
        if: always()
        run: cat eval-report/scorecard.md >> "$GITHUB_STEP_SUMMARY" || true

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: eval-report
          path: |
            eval-report/score.json
            eval-report/scorecard.md
          retention-days: 90
      - name: A failure is a tracked thing, not an email
        # One open issue per workflow, as the other scheduled workflows do (27.2.7):
        # a second failure comments on the first rather than filing another.
        if: failure() && github.event_name == 'schedule'
        uses: ./.github/actions/file-issue
        with:
          title: the weekly Score fell or failed
          failed: "The scheduled `eval` run failed"
          body: |-
            A track fell more than 2 points under its baseline, a gate failed, or a finding on the corpus has no label. Nothing users have changes; what is lost is the evidence that detection is still on target.

            Recovery: read the eval-report artifact's scorecard, fix the cause or label the new finding, then dispatch this workflow again.

      - name: A run that passes closes it
        # The same issue, closed once its cause has passed (R28.3, D64b).
        if: success() && github.event_name == 'schedule'
        uses: ./.github/actions/file-issue
        with:
          title: the weekly Score fell or failed
          passed: "true"
