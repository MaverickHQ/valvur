name: scorecard

# OpenSSF Scorecard (R22.1, D49a): how this repository is run, scored by
# ossf/scorecard-action. Weekly, and on every push to `main`, where the result is
# published to the public OpenSSF API and read by the README's badge. A pull request
# that changes what it reads runs it with publishing off, since Scorecard publishes only
# from the default branch: that run is how a branch measures its score. The result
# describes the repository, never a user's code. Permissions are the action's
# documented minimum, granted to the one job, and the workflow holds no env and no
# defaults, as publishing requires. That job may hold only the actions the API
# approves, so a scheduled failure's issue is filed by a job of its own.
on:
  schedule:
    - cron: "23 5 * * 2"     # Tuesdays, 05:23 UTC
  push:
    branches: [main]
  pull_request:
    # A change to what Scorecard reads measures itself, publishing off (R27.5): the
    # workflows, this one among them, the Dockerfiles, OSV-Scanner's ignores, the
    # manifests, the fixtures and the fuzzers.
    paths:
      - ".github/workflows/**"
      - "Dockerfile"
      - ".clusterfuzzlite/**"
      - "osv-scanner.toml"
      - "fuzz/**"
      - "tests/fixtures/**"
      - "requirements-*.txt"
      - "uv.lock"

permissions:
  contents: read

jobs:
  analysis:
    name: the Scorecard
    runs-on: ubuntu-26.04
    permissions:
      security-events: write    # the SARIF, to code scanning
      id-token: write           # the signed upload of a published result
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with:
          # JSON on a pull request, for the job below to print; SARIF otherwise,
          # for code scanning.
          results_file: scorecard.out
          results_format: ${{ github.event_name == 'pull_request' && 'json' || 'sarif' }}
          publish_results: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: scorecard
          path: scorecard.out
          retention-days: 30
      - uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        if: github.event_name != 'pull_request'
        with:
          sarif_file: scorecard.out

  # The branch's measurement (D49a): each check's score, in the log, apart from the
  # job above so that job holds only the steps a published result allows.
  report:
    name: the Scorecard, each check
    if: github.event_name == 'pull_request'
    needs: analysis
    runs-on: ubuntu-26.04
    permissions: {}
    timeout-minutes: 5
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: scorecard
      - name: Each check's score, and what kept a check under 10
        run: |
          jq -r '"score \(.score)", (.checks[] | "\(.score)\t\(.name)\t\(.reason)")' scorecard.out
          jq -r '.checks[] | select(.score < 10) | "\n## \(.name)", (.details // [])[:40][]' scorecard.out

  tracked:
    name: a failed run, tracked
    needs: [analysis, report]
    if: ${{ failure() && github.event_name == 'schedule' }}
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      issues: write         # open the one issue a failure gets (27.2.7)
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: A failure is a tracked thing, not an email
        if: failure()
        uses: ./.github/actions/file-issue
        with:
          title: the weekly Scorecard failed
          failed: "The scheduled `scorecard` run failed"
          body: |-
            The repository's Scorecard was not measured this week, and the README's badge keeps last week's result. Nothing users have changes.

            Recovery: read the run's log, fix the cause, then wait for the next push to `main` or the next week's run.
