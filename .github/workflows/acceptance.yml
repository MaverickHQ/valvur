name: acceptance

# The acceptance set on Linux, nightly (task R2.5): eight generated repositories
# scanned by the image built from this tree and judged against their
# `expected.toml`, plus the four lifecycle probes. It is the Linux half of every
# phase's exit (tasks.md §4); the Mac half runs by hand on the build machine.
# Agent scoring is not run here: it needs a Claude login and costs money.
on:
  schedule:
    - cron: "37 3 * * *"     # daily, 03:37 UTC
  workflow_dispatch:
  # A change to the judge is judged before it lands, and GitHub dispatches only a
  # workflow already on the default branch: the first run is the PR that adds it.
  pull_request:
    paths:
      - "scripts/acceptance.py"
      - "scripts/acceptance/**"
      - ".github/workflows/acceptance.yml"

permissions:
  contents: read

jobs:
  acceptance:
    name: eight repositories and four probes
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      issues: write         # open the one issue a failure gets (27.2.7)
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Repository 6 is this repository at a pinned commit, archived by git:
          # a shallow checkout does not have it (measured on the first run).
          fetch-depth: 0
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - id: version
        uses: ./.github/actions/version
      - name: Build the image from this tree
        env:
          VER: ${{ steps.version.outputs.version }}
        run: |
          SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)" \
            VALVUR_VERSION="$VER" docker buildx bake dev \
              --set '*.cache-from=type=gha' --set '*.cache-to=type=gha,mode=max'
      - run: uv venv --python 3.12
      - run: uv sync --extra dev --locked

      - name: Fetch the vulnerability database and the name index
        env:
          VALVUR_IMAGE: valvur:dev
        run: uv run valvur update

      - name: The acceptance set and the lifecycle probes
        env:
          VALVUR_IMAGE: valvur:dev
        run: |
          # --rescan: each repository a second time, nothing changed, for the
          # speed gate's warm scan (R14.5, D21).
          uv run python scripts/acceptance.py --generate --probes --rescan \
            --set "$RUNNER_TEMP/acceptance" --out acceptance-report

      - name: Summary
        if: always()
        run: cat acceptance-report/report.md >> "$GITHUB_STEP_SUMMARY" || true

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: acceptance-report
          # The report, not the probe workspace beside it (30,000 files).
          path: |
            acceptance-report/report.json
            acceptance-report/report.md
          retention-days: 90
      - name: A failure is a tracked thing, not an email
        # One open issue per workflow, as the other scheduled workflows do (27.2.7):
        # a second failure comments on the first rather than filing another.
        if: failure() && github.event_name == 'schedule'
        uses: ./.github/actions/file-issue
        with:
          title: the nightly acceptance run failed
          failed: "The scheduled `acceptance` run failed"
          body: |-
            Nothing users have changes: the acceptance set scans generated repositories and publishes nothing. What is lost is the Linux half of every phase's exit.

            Recovery: read the report artifact for the repository or probe that failed, then dispatch this workflow again after the fix.

      - name: A run that passes closes it
        # The same issue, closed once its cause has passed (R28.3, D64b).
        if: success() && github.event_name == 'schedule'
        uses: ./.github/actions/file-issue
        with:
          title: the nightly acceptance run failed
          passed: "true"

  image:
    # The latest published image, judged nightly (R43.4, D81t, N2.7): the advisories
    # of today against the image users pull, which no lockfile in the tree describes.
    name: the published image, scanned as it ships
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      issues: write         # the one issue a fixable vulnerability gets
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      - run: uv venv --python 3.12
      - run: uv sync --extra dev --locked
      - name: The latest published image, and today's database
        env:
          VALVUR_IMAGE: ghcr.io/maverickhq/valvur:latest
        run: |
          docker pull "$VALVUR_IMAGE"
          uv run valvur update
      - name: Its own Trivy over its root filesystem, with no network
        run: |
          docker run --rm --network none -v "$HOME/.cache/valvur/trivy:/db:ro" \
            --entrypoint trivy ghcr.io/maverickhq/valvur:latest rootfs --cache-dir /db \
            --cache-backend memory --skip-db-update --skip-java-db-update --offline-scan \
            --format json --scanners vuln --quiet / > image-scan.json
      - name: Judged against the owner's acceptances
        run: python3 scripts/image_gate.py image-scan.json --out image-gate.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: image-gate-published
          path: |
            image-scan.json
            image-gate.json
          retention-days: 30
      - name: A fixable vulnerability in the published image is filed
        if: failure() && github.event_name == 'schedule'
        uses: ./.github/actions/file-issue
        with:
          title: the published image has a fixable vulnerability
          failed: "The nightly scan of `ghcr.io/maverickhq/valvur:latest` blocked"
          body: |-
            Users pull an image with a vulnerability that has a fixed version, and the owner has not accepted it. The run's `image-gate-published` artifact lists each one, with its package and the version that fixes it.

            Recovery: a base image or Scanner update, then a patch release; or, for a risk you accept, an entry with an expiry in `.github/image-accepted.yaml`.
      - name: A run that passes closes it
        if: success() && github.event_name == 'schedule'
        uses: ./.github/actions/file-issue
        with:
          title: the published image has a fixable vulnerability
          passed: "true"

  watchdog:
    # The nightly watches the watchdog (R42.5, D81s, N3.8): `watchdog.yml`'s own last
    # scheduled run is judged by the same rule it judges every other by, so neither
    # stops unseen. On a pull request it lists, and files nothing.
    name: the watchdog ran and passed
    runs-on: ubuntu-26.04
    permissions:
      actions: read    # the watchdog's scheduled runs
      issues: write    # its one issue, `watchdog: watchdog.yml`
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Judge the watchdog's last scheduled run
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$EVENT" = "pull_request" ]; then set -- --dry-run; fi
          python3 scripts/watchdog.py --repo "$REPO" --only watchdog.yml "$@"
      - name: A nightly that cannot judge the watchdog is filed
        if: failure() && github.event_name == 'schedule'
        uses: ./.github/actions/file-issue
        with:
          title: the nightly could not judge the watchdog
          failed: "The scheduled `acceptance` run could not read the watchdog's runs"
          body: |-
            Nothing users have changes. What is lost is the check that the watchdog itself ran, which is what keeps it from stopping unseen.

            Recovery: read the job's log; the Actions API or the token is the usual cause. Dispatch this workflow again after the fix.

      - name: A run that judged it closes that
        if: success() && github.event_name == 'schedule'
        uses: ./.github/actions/file-issue
        with:
          title: the nightly could not judge the watchdog
          passed: "true"
