name: macos probe

# Not a lane, and not a claim: one question, asked by hand (task 27.2.1).
#
# The README says valvur is supported on macOS, and macOS is where the primary
# client runs — but every real-container job in `ci.yml` is `ubuntu-24.04` or
# `ubuntu-24.04-arm`, and `test_portability.py`'s macOS cases monkeypatch
# `platform.system()`, which cannot exercise Docker Desktop's mount sharing, a
# Podman VM's paths, or UID translation in a container. So the claim is "tested by
# hand on a Mac", which is true, and a continuous lane would be better if one can
# exist at all.
#
# GitHub's macOS runners are virtual machines on Apple silicon — measured on the
# first run of this probe: `Apple M1 (Virtual)`, and `kern.hv_vmm_present: 1`,
# which says this machine is ITSELF running under a hypervisor. Whether a second
# level is available to Lima's VM is the question, and it is the one a container
# runtime's existence there depends on. This workflow finds out, rather than
# assuming: install Colima, start it with a short
# deadline, and run the smallest possible container. Its outcome is recorded in
# 27.2.1's STATUS note either way — a green run makes a scheduled lane worth a
# task of its own, a red one is the evidence the README's row is as good as it
# can get.
# **Answered 2026-09-22 (run 35757706987): no.** colima installs in 5s and Lima's
# `vz` driver starts, then the VM exits before boot — `error starting vm: error at
# 'creating and starting': exit status 1`, 10s in. So there is no macOS lane to
# schedule, and the README's platform row says what is true instead. Kept, and
# worth re-dispatching when GitHub's macOS runner images change.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    name: can a container run on a macOS runner at all?
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: What this runner is
        run: |
          sw_vers
          uname -m
          sysctl -n machdep.cpu.brand_string || true
          # The question under the question: nested virtualisation.
          sysctl -a 2>/dev/null | grep -i "hv_support\|vmm" || echo "no hypervisor capability reported"

      - name: Install a container runtime
        id: install
        run: |
          set -eu
          start=$(date +%s)
          brew install colima docker
          echo "installed in $(( $(date +%s) - start ))s"
          colima version || true

      - name: Start it, with a deadline
        id: start
        continue-on-error: true
        run: |
          set -eu
          start=$(date +%s)
          # Five minutes is the task's cap: past that, a developer's first run is
          # not what this workflow would be measuring. Bounded by hand rather than
          # with `timeout`, which is GNU coreutils and is not on macOS — the first
          # run of this probe measured nothing at all because of that, and reported
          # "did not start within 300s" when nothing had been started.
          colima start --cpu 2 --memory 4 --disk 20 &
          colima_pid=$!
          deadline=$(( start + 300 ))
          while kill -0 "$colima_pid" 2>/dev/null && [ "$(date +%s)" -lt "$deadline" ]; do
            sleep 5
          done
          if kill -0 "$colima_pid" 2>/dev/null; then
            kill "$colima_pid" 2>/dev/null || true
            echo "::warning::colima had not started after $(( $(date +%s) - start ))s"
            echo "up=false" >> "$GITHUB_OUTPUT"
          elif wait "$colima_pid"; then
            echo "started in $(( $(date +%s) - start ))s"
            colima status || true
            echo "up=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::colima exited non-zero after $(( $(date +%s) - start ))s"
            echo "up=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Run the smallest possible container
        if: steps.start.outputs.up == 'true'
        continue-on-error: true
        run: |
          set -eu
          start=$(date +%s)
          docker run --rm alpine:3.20 echo "a container ran on a macOS runner"
          echo "first container in $(( $(date +%s) - start ))s"

      - name: Say what happened
        if: always()
        run: |
          {
            echo "## macOS probe (27.2.1)"
            echo
            echo "- runtime start: \`${{ steps.start.outputs.up }}\`"
            echo "- runner: \`macos-15\`, $(uname -m)"
            echo
            echo "A green run means a scheduled macOS lane is possible and is worth a"
            echo "task of its own. A red one means the README's row says what it can:"
            echo "macOS is tested by hand, on a real Mac, at each release."
          } >> "$GITHUB_STEP_SUMMARY"
