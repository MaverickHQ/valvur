name: release

# Triggered by a tag, so the release is a consequence of the tag rather than a
# sequence of hand-run commands. 12.2 and 12.5 were both manual, which is how a
# mismatched artifact ships: the image built from one tree, the wheel from another.
on:
  push:
    tags: ["v*"]
  # A REHEARSAL, never a release (22.B.1). Dispatching this by hand runs every step
  # against throwaway targets: a scratch GHCR package, TestPyPI, and a draft
  # pre-release on a `rehearsal-N` tag that the job deletes on its way out. The
  # version is suffixed `.devN` so nothing it publishes can be mistaken for, or
  # collide with, a real one. Same steps, same permissions, same identity — the
  # only way to find out what breaks before the first real tag does it in public.
  workflow_dispatch:

# Least privilege by default; every elevation is per-job and justified where it is
# granted. ci.yml's top-level `contents: read` is the same rule.
permissions:
  contents: read

# One release at a time, globally — not one per tag (19.B.2). Two different tags are
# the dangerous case, not two pushes of the same one: both build `:latest`, so the
# slower workflow can leave `latest` pointing at the older version while its own
# signature, attestation and GitHub release all say otherwise.
#
# Never cancel-in-progress. A release cancelled between `docker buildx --push` and
# `cosign sign` leaves an unsigned image published under a real version tag, which is
# strictly worse than a queued job.
concurrency:
  group: release
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  # One expression decides which world this run publishes into. Everything below
  # reads IMAGE and REHEARSAL rather than re-deriving the event, so the two paths
  # cannot drift apart in one step and not another.
  REHEARSAL: ${{ github.event_name == 'workflow_dispatch' }}
  IMAGE: ${{ github.event_name == 'workflow_dispatch' && 'ghcr.io/maverickhq/valvur-rehearsal' || 'ghcr.io/maverickhq/valvur' }}

jobs:
  verify:
    name: the tag says what the tree says
    runs-on: ubuntu-latest
    outputs:
      # `version` is what the tree declares and what the tests run against — F1.9
      # compares the shim to the image label, so it must be the real one even in a
      # rehearsal. `publish_version` is what leaves the runner: the same, or the
      # rehearsal's `.devN` suffix.
      version: ${{ steps.version.outputs.version }}
      publish_version: ${{ steps.version.outputs.publish_version }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
      - uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1

      - name: The tag must match the declared version
        id: version
        # The one moment nobody runs the test suite before taking the path, and the
        # one moment a version mismatch is expensive. F1.9 compares the shim against
        # the image; if the tag and pyproject disagree, they are already wrong.
        run: |
          DECLARED=$(grep -m1 '^version' pyproject.toml | cut -d'"' -f2)
          if [ "$REHEARSAL" = "true" ]; then
            PUBLISH="${DECLARED}.dev${GITHUB_RUN_NUMBER}"
            echo "REHEARSAL: tree declares $DECLARED; publishing $PUBLISH to throwaway targets"
          else
            TAG="${GITHUB_REF_NAME#v}"
            if [ "$TAG" != "$DECLARED" ]; then
              echo "::error::Tag ${GITHUB_REF_NAME} does not match pyproject.toml version ${DECLARED}."
              exit 1
            fi
            PUBLISH="$DECLARED"
            echo "releasing $DECLARED"
          fi
          echo "version=$DECLARED" >> "$GITHUB_OUTPUT"
          echo "publish_version=$PUBLISH" >> "$GITHUB_OUTPUT"

      - run: uv venv --python 3.12

      - name: Lint, types, traceability, unit tests, package build
        # The same script CI and contributors run (19.A.3). Release used to hold its
        # own copy of these commands, which is how it ended up linting a wider set
        # than CI did (19.A.2).
        run: ./scripts/verify.sh

      - name: Build the image the tests will run against
        run: |
          docker buildx build --load \
            --cache-from type=gha --cache-to type=gha,mode=max \
            --build-arg VALVUR_VERSION="${{ steps.version.outputs.version }}" \
            -t valvur:dev .

      - name: Restore the package-name index between runs
        # ADR-0018: the first `valvur update` walks all of npm — 439 requests and
        # about five minutes, measured. Restored from the last run it is an
        # incremental refresh of seconds. Saved under a fresh key every run so the
        # newest state is what the next run restores.
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/valvur/names
          key: valvur-name-index-${{ github.run_id }}
          restore-keys: valvur-name-index-

      - name: Fetch the vulnerability database and the name index
        # Before the suite, not only before the self-scan: the e2e canary asserts a
        # COMPLETE run on `full`, and since ADR-0018 the dependency-reality Check
        # refuses to run offline without the index — so the tests need both.
        env:
          VALVUR_IMAGE: valvur:dev
        run: uv run valvur update

      - name: The whole suite, not just the fast half
        # verify.sh runs `-m "not e2e"` because it must work without a container.
        # Release is the one place that has one, so the e2e half runs here.
        env:
          VALVUR_IMAGE: valvur:dev
        run: uv run pytest -q

      - name: valvur adds no GPL component (F10.4)
        run: uv run python scripts/check_image_licences.py valvur:dev python:3.12-alpine3.22

      - name: Self-scan gate (N2.5)
        env:
          VALVUR_IMAGE: valvur:dev
        run: |
          uv run valvur scan . --profile full
          uv run python - <<'PY'
          import json, pathlib, sys
          results = pathlib.Path(".security-scan")
          findings = json.loads((results / "findings.json").read_text())["findings"]
          run = json.loads((results / "run.json").read_text())
          bad = []
          if not run.get("complete"):
              bad.append("a Scanner did not complete, so this result proves nothing")
          bad += [f"{f['severity']}: {f['rule']} in {f['path']}"
                  for f in findings if not f.get("suppressed")]
          bad += [f"{f['rule']}: {f['title']}" for f in findings
                  if f["rule"] in {"valvur.suppression.expired", "valvur.suppression.stale"}]
          for line in bad:
              print(f"::error::{line}")
          sys.exit(1 if bad else 0)
          PY

  release:
    name: sign, attest and publish
    needs: verify
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write       # create the GitHub release
      packages: write       # push the image to GHCR
      id-token: write       # keyless signing, and PyPI trusted publishing
      attestations: write   # SLSA build provenance
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
      - uses: sigstore/cosign-installer@d7543c93d881b35a8faa02e8e3605f69b7a1ce62 # v3.10.0
      - uses: docker/setup-qemu-action@29109295f81e9208d7d86ff1c6c12d2833863392 # v3.6.0
      - uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1

      - name: In a rehearsal, publish under a version nothing real can collide with
        if: env.REHEARSAL == 'true'
        env:
          PUBLISH: ${{ needs.verify.outputs.publish_version }}
        # The tree's version is what the tests ran against; the `.devN` suffix is
        # applied only here, to what leaves the runner. `uv build` reads pyproject,
        # so the file is rewritten in this checkout and never committed.
        run: |
          sed -i "s/^version = \".*\"/version = \"${PUBLISH}\"/" pyproject.toml
          grep -m1 '^version' pyproject.toml

      - name: Push the image, for both architectures
        id: push
        env:
          VERSION: ${{ needs.verify.outputs.publish_version }}
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login "$REGISTRY" -u "${{ github.actor }}" --password-stdin
          # Both architectures, in one index. Published single-arch, valvur is
          # unusable for every amd64 user — most CI, most Linux desktops, every
          # cloud VM, every Intel Mac — and the Dockerfile already handles both.
          docker buildx build \
            --platform linux/amd64,linux/arm64 \
            --cache-from type=gha \
            --build-arg VALVUR_VERSION="$VERSION" \
            -t "$IMAGE:$VERSION" -t "$IMAGE:latest" \
            --metadata-file metadata.json \
            --push .
          # buildx pushes directly, so there is no local image to inspect. The digest
          # comes from the build metadata and is the digest of the multi-platform
          # INDEX — signing a child manifest would leave the other architecture
          # unsigned, which is the same defect as signing a tag.
          DIGEST=$(python3 -c "import json;print(json.load(open('metadata.json'))['containerimage.digest'])")
          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"
          echo "pushed $IMAGE:$VERSION@$DIGEST"

      - name: The index really does carry both architectures
        # Asserted here rather than trusted, because this is the exact claim that was
        # wrong before: a --platform flag silently ignored, or a builder falling back
        # to the runner's own architecture, both produce a successful-looking push.
        env:
          VERSION: ${{ needs.verify.outputs.publish_version }}
        run: |
          PLATFORMS=$(docker buildx imagetools inspect "$IMAGE:$VERSION" --raw \
            | python3 -c "import json,sys; d=json.load(sys.stdin); print(' '.join(sorted(f\"{m['platform']['os']}/{m['platform']['architecture']}\" for m in d.get('manifests', []) if m.get('platform',{}).get('architecture') != 'unknown')))")
          echo "published platforms: $PLATFORMS"
          for want in linux/amd64 linux/arm64; do
            case " $PLATFORMS " in
              *" $want "*) ;;
              *) echo "::error::published index is missing $want"; exit 1 ;;
            esac
          done

      - name: Sign the image, keylessly
        # No key to store, rotate or leak. The signature is bound to this workflow's
        # OIDC identity and recorded in the public Rekor transparency log, so anyone
        # can verify who built it and from which commit — without trusting us.
        run: cosign sign --yes "${IMAGE}@${{ steps.push.outputs.digest }}"

      - name: Attest build provenance (SLSA)
        # Found by the first rehearsal (22.B.1, 2026-09-12): GitHub refuses to
        # persist attestations for a user-owned PRIVATE repository — "make this
        # repository public". A rehearsal on the private repository therefore skips
        # this step and says so; a real release never skips it, because a release
        # from a private repository is one nobody can pull anyway (task 12a.1).
        if: env.REHEARSAL != 'true' || github.event.repository.visibility == 'public'
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3.0.0
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

      - name: Attestation not rehearsed on a private repository
        if: env.REHEARSAL == 'true' && github.event.repository.visibility != 'public'
        run: |
          echo "::warning::Build provenance was NOT attested: GitHub does not persist attestations for a user-owned private repository. This step is unrehearsed until the repository is public."

      - name: SBOM of the image
        # Distinct from the sbom.cdx.json valvur writes for a scanned project: this
        # one describes the released artifact. F10.4 requires publishing it, because
        # the base image carries GPL components and disclosure is the honest answer
        # to a claim no Linux container could satisfy.
        #
        # Straight from the registry, with the workflow's own token, and no Docker
        # socket in the SBOM container. The second rehearsal (22.B.1) found the
        # previous form — syft through the daemon's socket — failing `unauthorized`:
        # the daemon had the runner's login, the syft container did not, and a
        # freshly created GHCR package is private, so the anonymous fallback failed
        # too. Pinned to one platform so the SBOM describes one image, not whichever
        # child of the index the runner happens to match.
        env:
          VERSION: ${{ needs.verify.outputs.publish_version }}
          SYFT_REGISTRY_AUTH_AUTHORITY: ghcr.io
          SYFT_REGISTRY_AUTH_USERNAME: ${{ github.actor }}
          SYFT_REGISTRY_AUTH_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for format in cyclonedx-json:cdx spdx-json:spdx; do
            docker run --rm \
              -e SYFT_REGISTRY_AUTH_AUTHORITY -e SYFT_REGISTRY_AUTH_USERNAME -e SYFT_REGISTRY_AUTH_PASSWORD \
              anchore/syft:v1.51.1 "registry:$IMAGE:$VERSION" --platform linux/amd64 \
              -o "${format%%:*}" > "valvur-$VERSION.${format##*:}.json"
          done
          ls -la valvur-"$VERSION".*.json

      - name: Build the Python distributions
        run: uv build

      - name: Publish to PyPI
        # Trusted publishing: an OIDC exchange rather than a long-lived API token, so
        # there is no secret to leak. Configured on PyPI against this repository and
        # this workflow file.
        if: env.REHEARSAL != 'true'
        uses: pypa/gh-action-pypi-publish@cef221092ed1bacb1cc03d23a2d87d1d172e277b # v1.14.0

      - name: Publish to TestPyPI (rehearsal)
        # The same action, the same OIDC identity, a different index. Needs its own
        # trusted publisher on test.pypi.org — see docs/RELEASING.md. Allowed to
        # fail WITHOUT stopping the rehearsal, so the release step after it is still
        # exercised; the report at the end turns the run red if it did.
        id: testpypi
        if: env.REHEARSAL == 'true'
        continue-on-error: true
        uses: pypa/gh-action-pypi-publish@cef221092ed1bacb1cc03d23a2d87d1d172e277b # v1.14.0
        with:
          repository-url: https://test.pypi.org/legacy/

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.verify.outputs.publish_version }}
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          {
            echo "## Verify this release before trusting it"
            echo
            echo 'The image is signed keylessly, so there is no key to trust — only a'
            echo 'transparency-log entry naming the workflow that built it:'
            echo
            echo '```bash'
            echo "cosign verify ${IMAGE}@${DIGEST} \\"
            echo "  --certificate-identity-regexp '^https://github.com/MaverickHQ/valvur/' \\"
            echo "  --certificate-oidc-issuer https://token.actions.githubusercontent.com"
            echo '```'
            echo
            echo 'Build provenance, and the SBOM attached below:'
            echo
            echo '```bash'
            echo "gh attestation verify oci://${IMAGE}:${VERSION} --repo MaverickHQ/valvur"
            echo '```'
            echo
            echo "Image digest: \`${DIGEST}\`"
            echo
            echo "See [CHANGELOG.md](https://github.com/MaverickHQ/valvur/blob/${GITHUB_REF_NAME}/CHANGELOG.md) for what changed."
          } > notes.md
          if [ "$REHEARSAL" = "true" ]; then
            # A draft pre-release on a throwaway tag, so the command, the token's
            # permissions and the asset upload are all exercised — and nothing is
            # visible to a watcher of the repository. Deleted by the last step.
            TAG="rehearsal-${GITHUB_RUN_NUMBER}"
            EXTRA="--draft --prerelease --target ${GITHUB_SHA}"
          else
            TAG="$GITHUB_REF_NAME"
            EXTRA=""
          fi
          # shellcheck disable=SC2086 # EXTRA is deliberately word-split
          gh release create "$TAG" $EXTRA \
            --title "valvur $VERSION" \
            --notes-file notes.md \
            "valvur-$VERSION.cdx.json" \
            "valvur-$VERSION.spdx.json" \
            dist/*

      - name: Remove the rehearsal's release and tag
        # `always()`: a rehearsal that failed halfway must not leave a draft behind
        # to be mistaken for a real one. The scratch image and the TestPyPI upload
        # stay, deliberately — they are the evidence the rehearsal produces.
        if: always() && env.REHEARSAL == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="rehearsal-${GITHUB_RUN_NUMBER}"
          gh release delete "$TAG" --yes --cleanup-tag 2>/dev/null \
            && echo "removed draft release $TAG" \
            || echo "no release $TAG to remove"

      - name: Rehearsal report
        # One place that says what was and was not proven. A step allowed to
        # continue on failure still fails the rehearsal here — it was allowed to
        # continue so the steps after it could be exercised, not so it could pass.
        if: always() && env.REHEARSAL == 'true'
        env:
          TESTPYPI: ${{ steps.testpypi.outcome }}
          PUBLIC: ${{ github.event.repository.visibility == 'public' }}
          VERSION: ${{ needs.verify.outputs.publish_version }}
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          {
            echo "## Rehearsal of release.yml"
            echo "- image: \`$IMAGE:$VERSION\` @ \`$DIGEST\`"
            echo "- attestation: $([ "$PUBLIC" = true ] && echo rehearsed || echo 'NOT rehearsed (private repository)')"
            echo "- TestPyPI publish: $TESTPYPI"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$TESTPYPI" != "success" ]; then
            echo "::error::TestPyPI publish outcome was '$TESTPYPI'. Configure the trusted publisher on test.pypi.org (docs/RELEASING.md) and rehearse again."
            exit 1
          fi
