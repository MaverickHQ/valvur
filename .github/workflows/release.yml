name: release

# Triggered by a tag, so the release is a consequence of the tag rather than a
# sequence of hand-run commands. 12.2 and 12.5 were both manual, which is how a
# mismatched artifact ships: the image built from one tree, the wheel from another.
on:
  push:
    tags: ["v*"]
  # A REHEARSAL, never a release (22.B.1). Dispatching this by hand runs every step
  # against throwaway targets: a scratch GHCR package, TestPyPI, and a draft
  # pre-release on a `rehearsal-N` tag that the job deletes on its way out. The
  # version is suffixed `.devN` so nothing it publishes can be mistaken for, or
  # collide with, a real one. Same steps, same permissions, same identity — the
  # only way to find out what breaks before the first real tag does it in public.
  workflow_dispatch:

# Least privilege by default; every elevation is per-job and justified where it is
# granted. ci.yml's top-level `contents: read` is the same rule.
permissions:
  contents: read

# One release at a time, globally — not one per tag (19.B.2). Two different tags are
# the dangerous case, not two pushes of the same one: both build `:latest`, so the
# slower workflow can leave `latest` pointing at the older version while its own
# signature, attestation and GitHub release all say otherwise.
#
# Never cancel-in-progress. A release cancelled between `docker buildx --push` and
# `cosign sign` leaves an unsigned image published under a real version tag, which is
# strictly worse than a queued job.
concurrency:
  group: release
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  # One expression decides which world this run publishes into. Everything below
  # reads IMAGE and REHEARSAL rather than re-deriving the event, so the two paths
  # cannot drift apart in one step and not another.
  REHEARSAL: ${{ github.event_name == 'workflow_dispatch' }}
  IMAGE: ${{ github.event_name == 'workflow_dispatch' && 'ghcr.io/maverickhq/valvur-rehearsal' || 'ghcr.io/maverickhq/valvur' }}

jobs:
  verify:
    name: the tag says what the tree says
    runs-on: ubuntu-24.04
    outputs:
      # `version` is what the tree declares and what the tests run against — F1.9
      # compares the shim to the image label, so it must be the real one even in a
      # rehearsal. `publish_version` is what leaves the runner: the same, or the
      # rehearsal's `.devN` suffix.
      version: ${{ steps.version.outputs.version }}
      publish_version: ${{ steps.version.outputs.publish_version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: The tag must match the declared version
        id: version
        # The one moment nobody runs the test suite before taking the path, and the
        # one moment a version mismatch is expensive. F1.9 compares the shim against
        # the image; if the tag and pyproject disagree, they are already wrong.
        run: |
          DECLARED=$(grep -m1 '^version' pyproject.toml | cut -d'"' -f2)
          if [ "$REHEARSAL" = "true" ]; then
            PUBLISH="${DECLARED}.dev${GITHUB_RUN_NUMBER}"
            echo "REHEARSAL: tree declares $DECLARED; publishing $PUBLISH to throwaway targets"
          else
            TAG="${GITHUB_REF_NAME#v}"
            if [ "$TAG" != "$DECLARED" ]; then
              echo "::error::Tag ${GITHUB_REF_NAME} does not match pyproject.toml version ${DECLARED}."
              exit 1
            fi
            PUBLISH="$DECLARED"
            echo "releasing $DECLARED"
          fi
          echo "version=$DECLARED" >> "$GITHUB_OUTPUT"
          echo "publish_version=$PUBLISH" >> "$GITHUB_OUTPUT"

      - name: A real tag is signed by a known key and sits on main
        # 28.0.2. The version match above was the only thing that stood between a
        # write-scoped token and a signed release. Now the tag object must carry a
        # signature from a key named in .github/allowed_signers — the same key that
        # signs every commit on main — and the commit it points at must be on main,
        # so a tag on a branch cannot release that branch. A rehearsal has no tag
        # and runs from a branch; both checks are for the real thing only.
        if: env.REHEARSAL != 'true'
        run: |
          set -eu
          git fetch --no-tags --depth=500 origin "+refs/heads/main:refs/remotes/origin/main"
          git fetch --depth=1 origin "+refs/tags/${GITHUB_REF_NAME}:refs/tags/${GITHUB_REF_NAME}"
          git -c gpg.ssh.allowedSignersFile=.github/allowed_signers tag -v "$GITHUB_REF_NAME"
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::${GITHUB_REF_NAME} points at ${GITHUB_SHA}, which is not on main."
            exit 1
          fi
          echo "${GITHUB_REF_NAME} is signed by a known key and is on main"

      - run: uv venv --python 3.12

      - name: Lint, types, traceability, unit tests, package build
        # The same script CI and contributors run (19.A.3). Release used to hold its
        # own copy of these commands, which is how it ended up linting a wider set
        # than CI did (19.A.2).
        run: ./scripts/verify.sh

      - name: Build the image the tests will run against
        # Through the bake file, like every other build of this image (23.4.3).
        env:
          VALVUR_VERSION: ${{ steps.version.outputs.version }}
        run: |
          # The commit's time for every file in every layer (28.4.5): two builds
          # of one tree are one digest, here and on anyone's machine.
          export SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)"
          docker buildx bake dev \
            --set '*.cache-from=type=gha' --set '*.cache-to=type=gha,mode=max'

      - name: Restore the package-name index between runs
        # ADR-0018: the first `valvur update` walks all of npm — 439 requests and
        # about five minutes, measured. Restored from the last run it is an
        # incremental refresh of seconds. Saved under a fresh key every run so the
        # newest state is what the next run restores.
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/valvur/names
          key: valvur-name-index-${{ github.run_id }}
          restore-keys: valvur-name-index-

      - name: Fetch the vulnerability database and the name index
        # Before the suite, not only before the self-scan: the e2e canary asserts a
        # COMPLETE run on `full`, and since ADR-0018 the dependency-reality Check
        # refuses to run offline without the index — so the tests need both.
        env:
          VALVUR_IMAGE: valvur:dev
        run: uv run valvur update

      - name: The whole suite, not just the fast half
        # verify.sh runs `-m "not e2e"` because it must work without a container.
        # Release is the one place that has one, so the e2e half runs here.
        env:
          VALVUR_IMAGE: valvur:dev
        run: uv run pytest -q

      - name: valvur adds no GPL component (F10.4)
        run: uv run python scripts/check_image_licences.py valvur:dev python:3.12-alpine3.22

      - name: Self-scan gate (N2.5)
        env:
          VALVUR_IMAGE: valvur:dev
        run: |
          uv run valvur scan . --profile full
          uv run valvur gate . --fail-on any --no-inconclusive

  build:
    # Each architecture on its own native runner (23.4.3). Under QEMU on the amd64
    # runner, both took 4m50s on v0.2.0; natively each is a fraction, and they run
    # side by side. The manifests are pushed by digest, untagged, and the release
    # job below writes one index over both — that index is what gets signed.
    name: build ${{ matrix.arch }}, natively
    needs: verify
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write       # push the manifest, by digest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build this architecture and push it by digest
        id: build
        env:
          VALVUR_VERSION: ${{ needs.verify.outputs.publish_version }}
          BAKE_IMAGE: ${{ env.IMAGE }}
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login "$REGISTRY" -u "${{ github.actor }}" --password-stdin
          # No --platform: the builder's native one, which is the runner's. The
          # cache is scoped per architecture so the two do not overwrite each other.
          # The commit's time for every file in every layer (28.4.5).
          export SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)"
          docker buildx bake release \
            --set "*.cache-from=type=gha,scope=release-${{ matrix.arch }}" \
            --set "*.cache-to=type=gha,mode=max,scope=release-${{ matrix.arch }}" \
            --metadata-file metadata.json
          DIGEST=$(python3 -c "import json;print(json.load(open('metadata.json'))['release']['containerimage.digest'])")
          ARCH=$(docker buildx imagetools inspect "$IMAGE@$DIGEST" --raw | python3 -c "import json,sys; d=json.load(sys.stdin); print(d.get('architecture') or [m['platform']['architecture'] for m in d.get('manifests',[]) if m.get('platform',{}).get('architecture')!='unknown'][0])" 2>/dev/null || echo unknown)
          echo "pushed $IMAGE@$DIGEST for ${{ matrix.arch }} (manifest says: $ARCH)"
          echo "$DIGEST" > "digest-${{ matrix.arch }}"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: digest-${{ matrix.arch }}
          path: digest-${{ matrix.arch }}
          if-no-files-found: error
          retention-days: 1

  stage:
    # 26.1.1: stage → validate → promote. This job pushes the index under a
    # CANDIDATE tag, signs and attests its digest, publishes the SBOM as a run
    # artifact and builds `dist/` — nothing a user can install or pull by the
    # version's name. `artifact` validates the pair; only `promote`, after it,
    # re-tags the signed digest as `:$VERSION` and `:latest`, uploads to PyPI and
    # creates the GitHub release. Until this the same job did all of it before
    # validation, and its successor's comment admitted it could not stop a release
    # that had left. A red `artifact` job now leaves a candidate tag on GHCR and
    # nothing else; the version number is not burned.
    name: stage — push the candidate, sign, attest, build the wheel
    needs: [verify, build]
    runs-on: ubuntu-24.04
    outputs:
      # The digest of the signed index — what `artifact` pulls and `promote`
      # re-tags, so both act on the bytes this job signed and nothing a tag could
      # later move to.
      digest: ${{ steps.push.outputs.digest }}
    permissions:
      contents: read
      packages: write       # write the index and the signature to GHCR
      id-token: write       # keyless signing
      attestations: write   # SLSA build provenance
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: In a rehearsal, publish under a version nothing real can collide with
        if: env.REHEARSAL == 'true'
        env:
          PUBLISH: ${{ needs.verify.outputs.publish_version }}
        # The tree's version is what the tests ran against; the `.devN` suffix is
        # applied only here, to what leaves the runner. `uv build` reads pyproject,
        # so the file is rewritten in this checkout and never committed.
        run: |
          sed -i "s/^version = \".*\"/version = \"${PUBLISH}\"/" pyproject.toml
          grep -m1 '^version' pyproject.toml

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: digest-*
          merge-multiple: true

      - name: One index over both architectures, under the candidate tag
        id: push
        env:
          VERSION: ${{ needs.verify.outputs.publish_version }}
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login "$REGISTRY" -u "${{ github.actor }}" --password-stdin
          AMD64=$(cat digest-amd64); ARM64=$(cat digest-arm64)
          echo "amd64 $AMD64"; echo "arm64 $ARM64"
          # Both architectures, in one index. Published single-arch, valvur is
          # unusable for every amd64 user — most CI, most Linux desktops, every
          # cloud VM, every Intel Mac.
          #
          # The candidate tag, not the version's: the shim of this version pulls
          # `:$VERSION`, and that name must not exist until `promote` has seen
          # `artifact` go green. The tag is what a person inspects; every job
          # below works from the digest.
          docker buildx imagetools create \
            -t "$IMAGE:$VERSION-candidate" \
            "$IMAGE@$AMD64" "$IMAGE@$ARM64"
          # The digest of the multi-platform INDEX — signing a child manifest would
          # leave the other architecture unsigned, which is the same defect as
          # signing a tag.
          DIGEST=$(docker buildx imagetools inspect "$IMAGE:$VERSION-candidate" --format '{{json .Manifest.Digest}}' | tr -d '"')
          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"
          echo "pushed $IMAGE:$VERSION-candidate@$DIGEST"

      - name: The index really does carry both architectures
        # Asserted here rather than trusted, because this is the exact claim that was
        # wrong before: a --platform flag silently ignored, or a builder falling back
        # to the runner's own architecture, both produce a successful-looking push.
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          PLATFORMS=$(docker buildx imagetools inspect "$IMAGE@$DIGEST" --raw \
            | python3 -c "import json,sys; d=json.load(sys.stdin); print(' '.join(sorted(f\"{m['platform']['os']}/{m['platform']['architecture']}\" for m in d.get('manifests', []) if m.get('platform',{}).get('architecture') != 'unknown')))")
          echo "published platforms: $PLATFORMS"
          for want in linux/amd64 linux/arm64; do
            case " $PLATFORMS " in
              *" $want "*) ;;
              *) echo "::error::published index is missing $want"; exit 1 ;;
            esac
          done

      - name: Sign the image, keylessly
        # No key to store, rotate or leak. The signature is bound to this workflow's
        # OIDC identity and recorded in the public Rekor transparency log, so anyone
        # can verify who built it and from which commit — without trusting us.
        run: cosign sign --yes "${IMAGE}@${{ steps.push.outputs.digest }}"

      - name: Attest build provenance (SLSA)
        # Unconditional since 26.1.3. The first rehearsal (22.B.1, 2026-09-12)
        # found GitHub refusing to persist attestations for a user-owned private
        # repository, and this step carried a skip-with-a-warning for that case
        # until 2026-09-21 — a week after the repository went public (12a.1), and
        # a way for a real failure to read as an expected skip. `artifact` verifies
        # what this produces.
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

      - name: SBOM of the image
        # Distinct from the sbom.cdx.json valvur writes for a scanned project: this
        # one describes the released artifact. F10.4 requires publishing it, because
        # the base image carries GPL components and disclosure is the honest answer
        # to a claim no Linux container could satisfy.
        #
        # Straight from the registry, with the workflow's own token, and no Docker
        # socket in the SBOM container. The second rehearsal (22.B.1) found the
        # previous form — syft through the daemon's socket — failing `unauthorized`:
        # the daemon had the runner's login, the syft container did not, and a
        # freshly created GHCR package is private, so the anonymous fallback failed
        # too. One SBOM per child of the index, each naming its platform: the image
        # ships for two architectures and until 27.0.2 only amd64 was described.
        #
        # The syft that reads the image is the syft the image was built with — the
        # Dockerfile's digest pin, read from the Dockerfile here rather than copied,
        # so there is one pin and nothing to drift. Until 27.0.2 this ran syft by
        # its version TAG — the one floating pointer left in a pipeline where every
        # action is a SHA and every base image a digest.
        env:
          VERSION: ${{ needs.verify.outputs.publish_version }}
          DIGEST: ${{ steps.push.outputs.digest }}
          SYFT_REGISTRY_AUTH_AUTHORITY: ghcr.io
          SYFT_REGISTRY_AUTH_USERNAME: ${{ github.actor }}
          SYFT_REGISTRY_AUTH_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          SYFT=$(sed -n 's/^FROM \(anchore\/syft@sha256:[0-9a-f]\{64\}\) AS syft$/\1/p' Dockerfile)
          test -n "$SYFT" || { echo "::error::the Dockerfile has no digest-pinned syft stage"; exit 1; }
          echo "syft: $SYFT"
          for platform in linux/amd64 linux/arm64; do
            for format in cyclonedx-json:cdx spdx-json:spdx; do
              docker run --rm \
                -e SYFT_REGISTRY_AUTH_AUTHORITY -e SYFT_REGISTRY_AUTH_USERNAME -e SYFT_REGISTRY_AUTH_PASSWORD \
                "$SYFT" "registry:$IMAGE@$DIGEST" --platform "$platform" \
                -o "${format%%:*}" > "valvur-$VERSION.${platform/\//-}.${format##*:}.json"
            done
          done
          ls -la valvur-"$VERSION".*.json
          # Each SBOM must describe the child it names, not whichever one syft
          # matched. Syft's CycloneDX metadata does not carry the architecture
          # (measured, 1.51.1), but every OS package's purl does — Alpine's apk
          # spells it `arch=x86_64` / `arch=aarch64`, Debian's dpkg `amd64` /
          # `arm64` (the first rehearsal of 27.0.2 found the assertion written for
          # the wrong one) — so the file for one architecture must carry its
          # spellings and never the other's. `noarch` packages belong to both.
          for arch in amd64 arm64; do
            python3 - "$arch" "valvur-$VERSION.linux-$arch.cdx.json" <<'PY'
          import collections, json, re, sys
          arch, path = sys.argv[1], sys.argv[2]
          spellings = {"amd64": {"amd64", "x86_64"}, "arm64": {"arm64", "aarch64"}}
          doc = json.load(open(path))
          seen = collections.Counter(
              m.group(1) for c in doc.get("components", [])
              for m in [re.search(r"[?&]arch=([^&]+)", c.get("purl", ""))] if m)
          other = {"amd64": "arm64", "arm64": "amd64"}[arch]
          own = sum(seen[a] for a in spellings[arch])
          foreign = sum(seen[a] for a in spellings[other])
          assert own and not foreign, f"{path}: purl architectures {dict(seen)}, expected {arch}"
          print(f"{path}: {len(doc['components'])} components, {own} purls naming {arch}, {dict(seen)}")
          PY
          done

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        # For `promote` to attach to the GitHub release: the SBOM of the digest it
        # promotes, generated once, here.
        with:
          name: sbom
          path: valvur-*.json
          if-no-files-found: error
          retention-days: 1

      - name: Build the Python distributions
        run: uv build

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        # The same files `artifact` tests and `promote` uploads to PyPI and attaches
        # to the GitHub release — one build, three consumers (12b.2, 26.1.1).
        with:
          name: dist
          path: dist/*
          if-no-files-found: error
          retention-days: 1


  artifact:
    # 12b.2, N2.5: the constraint suite and the self-scan gate against the RELEASE
    # ARTIFACT, not the tree. `verify` above runs the same suite and gate against
    # `valvur:dev` before anything is pushed — that proves the tree the tag points
    # at. This proves what a user gets: the wheel from `dist/`, installed into a
    # clean environment with the source tree deliberately off the path, driving
    # the image by the digest `stage` just signed. Since 26.1.1 this runs BEFORE
    # anything a user can install or pull exists under the version's name: a red
    # job here stops `promote`, and the candidate tag is all that was pushed. In a
    # rehearsal it runs against the scratch image and the `.devN` wheel, so it is
    # proven by the rehearsal every release gets first.
    name: the artifact, not the tree (N2.5), on ${{ matrix.arch }}
    needs: [verify, stage]
    # Both architectures, natively (26.1.2, F10.7): the index is one digest, and
    # each runner pulls its own child of it. Until this the arm64 image was
    # built, listed and never executed by the pipeline — every job that ran the
    # image ran on amd64. `promote` waits for both legs.
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: read        # pull the image this run pushed
    env:
      VERSION: ${{ needs.verify.outputs.publish_version }}
      DIGEST: ${{ needs.stage.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist

      - name: Install the wheel into a clean environment
        # `[dev]` for pytest and jsonschema, from the wheel's own extra. No
        # editable install, no `src/` on the path: `import valvur` must resolve to
        # site-packages, and the step after this one proves it did. The venv lives
        # outside the checkout: inside it, the self-scan would catalogue pytest's
        # dependencies as the project's.
        run: |
          VENV="$RUNNER_TEMP/artifact-venv"
          echo "VENV=$VENV" >> "$GITHUB_ENV"
          uv venv --python 3.12 "$VENV"
          WHEEL=$(ls dist/valvur-*.whl)
          echo "installing $WHEEL"
          uv pip install --python "$VENV/bin/python" "${WHEEL}[dev]"

      - name: The code under test is the wheel, and it is this tree's wheel
        # `_build.py` exists only in a built wheel (23.4.4) — the tree has none —
        # so importing it is the proof that the tree is not what is being tested,
        # and its digest must be the digest of the checkout the tag points at.
        run: |
          "$VENV/bin/python" - <<'PY'
          import pathlib, sys
          import valvur, valvur._build
          where = pathlib.Path(valvur.__file__).resolve()
          assert "site-packages" in where.parts, f"valvur imported from {where}, not the wheel"
          print(f"valvur {valvur.__version__} from {where.parent}")
          print(f"wheel built from {valvur._build.INPUTS_SHA256}")
          PY
          # The checkout's own digest, by the checkout's own hashing code (stdlib only).
          EXPECTED=$(python3 -c "import sys, pathlib; sys.path.insert(0, 'src'); from valvur import tree_hash; print(tree_hash.digest(tree_hash.tree_parts(pathlib.Path('.'))))")
          GOT=$("$VENV/bin/python" -c "import valvur._build as b; print(b.INPUTS_SHA256)")
          echo "checkout tree: $EXPECTED"
          [ "$GOT" = "$EXPECTED" ] || { echo "::error::the wheel was built from $GOT, this checkout is $EXPECTED"; exit 1; }

      - name: Pull the image by the digest stage signed, and verify both claims on it
        # The signature (cosign) and the SLSA build provenance (`gh attestation
        # verify`) — the two commands the release notes tell a user to run, run
        # here first. Until 26.1.3 the pipeline verified the signature it made and
        # never the attestation; the attestation was checked by hand, once.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login "$REGISTRY" -u "${{ github.actor }}" --password-stdin
          docker pull "$IMAGE@$DIGEST"
          ARCH=$(docker image inspect "$IMAGE@$DIGEST" --format '{{ .Architecture }}')
          echo "pulled the $ARCH child of $IMAGE@$DIGEST on $(uname -m)"
          # This run's own identity, exactly — release.yml at this ref — which is
          # stricter than any pattern and true in a rehearsal (refs/heads/<branch>)
          # and a release (refs/tags/vX.Y.Z) alike. The pattern users are given
          # names tags only, so a rehearsal's image verifies here and nowhere else.
          cosign verify "$IMAGE@$DIGEST" \
            --certificate-identity "https://github.com/${{ github.repository }}/.github/workflows/release.yml@${{ github.ref }}" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com >/dev/null
          echo "signature verified on $IMAGE@$DIGEST"
          gh attestation verify "oci://$IMAGE@$DIGEST" --repo MaverickHQ/valvur \
            --predicate-type https://slsa.dev/provenance/v1
          echo "build provenance verified on $IMAGE@$DIGEST"

      - name: The shim and the image agree they were built from the same tree
        # F1.9 and 23.4.4, on the release pair itself: the version label and the
        # build digest, read from the pulled image, must match the installed wheel.
        env:
          VALVUR_IMAGE: ${{ env.IMAGE }}@${{ env.DIGEST }}
        run: |
          LABEL=$(docker image inspect "$IMAGE@$DIGEST" --format '{{ index .Config.Labels "org.opencontainers.image.version" }}')
          IMAGE_TREE=$(docker run --rm --entrypoint cat "$IMAGE@$DIGEST" /etc/valvur/inputs.sha256)
          WHEEL_TREE=$("$VENV/bin/python" -c "import valvur._build as b; print(b.INPUTS_SHA256)")
          echo "image label $LABEL, built from $IMAGE_TREE"
          [ "$LABEL" = "$VERSION" ] || { echo "::error::image label $LABEL is not the published version $VERSION"; exit 1; }
          [ "$IMAGE_TREE" = "$WHEEL_TREE" ] || { echo "::error::image built from $IMAGE_TREE, wheel from $WHEEL_TREE"; exit 1; }

      - name: Fetch the vulnerability database and the name index
        env:
          VALVUR_IMAGE: ${{ env.IMAGE }}@${{ env.DIGEST }}
        run: '"$VENV/bin/valvur" update'

      - name: The constraint suite and the whole e2e suite, against the artifact
        # Phase 11's constraints (tests/test_constraints_*.py, test_not_cuttable.py)
        # in full, and every test marked e2e — through the wheel's code and the
        # signed image. `-rP` keeps N1.4's memory number in the log.
        env:
          VALVUR_IMAGE: ${{ env.IMAGE }}@${{ env.DIGEST }}
        run: |
          "$VENV/bin/python" -m pytest -q -rP tests/test_constraints_*.py tests/test_not_cuttable.py
          "$VENV/bin/python" -m pytest -q -rP -m e2e

      - name: The self-scan gate, against the artifact (N2.5)
        env:
          VALVUR_IMAGE: ${{ env.IMAGE }}@${{ env.DIGEST }}
        run: |
          "$VENV/bin/valvur" scan . --profile full
          "$VENV/bin/valvur" gate . --fail-on any --no-inconclusive

  promote:
    # The three things that cannot be taken back, after `artifact` has proven the
    # pair (26.1.1): the signed digest re-tagged as `:$VERSION` and `:latest` — a
    # manifest re-push, so the signature and the attestation on the digest hold —
    # the upload to PyPI, and the GitHub release. The `release` environment sits
    # here, so a required reviewer on it is a brake before the irreversible step
    # and after the evidence, not before the candidate push. Cheapest-to-undo
    # first: the tags can be re-pointed, PyPI cannot be un-uploaded.
    name: promote — the version tag, latest, PyPI, the GitHub release
    needs: [verify, stage, artifact]
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      contents: write       # create the GitHub release
      packages: write       # re-tag the digest as the version and latest
      id-token: write       # PyPI trusted publishing
    env:
      VERSION: ${{ needs.verify.outputs.publish_version }}
      DIGEST: ${{ needs.stage.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: sbom

      - name: Promote by re-tagging the signed digest as the version and latest
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login "$REGISTRY" -u "${{ github.actor }}" --password-stdin
          docker buildx imagetools create \
            -t "$IMAGE:$VERSION" -t "$IMAGE:latest" \
            "$IMAGE@$DIGEST"
          # The tag must resolve to the digest that was signed and validated —
          # anything else and the re-tag promoted something `artifact` never saw.
          for tag in "$VERSION" latest; do
            GOT=$(docker buildx imagetools inspect "$IMAGE:$tag" --format '{{json .Manifest.Digest}}' | tr -d '"')
            echo "$IMAGE:$tag → $GOT"
            [ "$GOT" = "$DIGEST" ] || { echo "::error::$IMAGE:$tag resolves to $GOT, not the validated $DIGEST"; exit 1; }
          done

      - name: Publish to PyPI
        # Trusted publishing: an OIDC exchange rather than a long-lived API token, so
        # there is no secret to leak. Configured on PyPI against this repository and
        # this workflow file.
        #
        # v1.14.2 or later, not older: `uv build` writes Metadata-Version 2.5 and the
        # twine inside v1.14.0 refused it (`InvalidDistribution: '2.5' is not a
        # valid metadata version`). Found by rehearsal #6, 2026-09-13 — the first
        # rehearsal with a TestPyPI publisher, and the only step that runs twine's
        # check — one PR before the real tag would have hit it.
        if: env.REHEARSAL != 'true'
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2

      - name: Publish to TestPyPI (rehearsal)
        # The same action, the same OIDC identity, a different index. Needs its own
        # trusted publisher on test.pypi.org — see docs/RELEASING.md. Allowed to
        # fail WITHOUT stopping the rehearsal, so the release step after it is still
        # exercised; the report at the end turns the run red if it did.
        id: testpypi
        if: env.REHEARSAL == 'true'
        continue-on-error: true
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          repository-url: https://test.pypi.org/legacy/

      - name: The index carries the attestation it was given, and it verifies
        # The publish action attests each file and PyPI stores the bundle; this
        # reads it back from the index just published to — pypi.org, or
        # test.pypi.org in a rehearsal — and verifies the local file against it
        # with the repository as the expected publisher (26.1.3, F10.3). The
        # bundle can take a moment to appear after the upload, hence the retry.
        # The distributions only: the publish action leaves each file's bundle
        # beside it as `<file>.publish.attestation`, and the first rehearsal of
        # this step asked the index for the provenance of an attestation.
        env:
          INDEX: ${{ env.REHEARSAL == 'true' && 'https://test.pypi.org' || 'https://pypi.org' }}
        run: |
          for file in dist/*.whl dist/*.tar.gz; do
            name=$(basename "$file")
            url="$INDEX/integrity/valvur/$VERSION/$name/provenance"
            for attempt in 1 2 3 4 5 6; do
              if curl -sf -o "$name.provenance.json" "$url"; then break; fi
              echo "attempt $attempt: no provenance yet at $url"; sleep 10
            done
            uvx --from pypi-attestations==0.0.30 pypi-attestations verify pypi \
              --repository https://github.com/MaverickHQ/valvur \
              --provenance-file "$name.provenance.json" "$file"
          done

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          {
            echo "## Verify this release before trusting it"
            echo
            echo 'The image is signed keylessly, so there is no key to trust — only a'
            echo 'transparency-log entry naming the workflow that built it:'
            echo
            echo '```bash'
            echo "cosign verify ${IMAGE}@${DIGEST} \\"
            echo "  --certificate-identity-regexp '^https://github.com/MaverickHQ/valvur/.github/workflows/release.yml@refs/tags/v' \\"
            echo "  --certificate-oidc-issuer https://token.actions.githubusercontent.com"
            echo '```'
            echo
            echo 'Build provenance, and the SBOMs attached below — one per architecture:'
            echo
            echo '```bash'
            echo "gh attestation verify oci://${IMAGE}:${VERSION} --repo MaverickHQ/valvur"
            echo '```'
            echo
            echo "Image digest: \`${DIGEST}\`"
            echo
            echo "See [CHANGELOG.md](https://github.com/MaverickHQ/valvur/blob/${GITHUB_REF_NAME}/CHANGELOG.md) for what changed."
          } > notes.md
          if [ "$REHEARSAL" = "true" ]; then
            # A draft pre-release on a throwaway tag, so the command, the token's
            # permissions and the asset upload are all exercised — and nothing is
            # visible to a watcher of the repository. Deleted by the last step.
            TAG="rehearsal-${GITHUB_RUN_NUMBER}"
            EXTRA="--draft --prerelease --target ${GITHUB_SHA}"
          else
            TAG="$GITHUB_REF_NAME"
            EXTRA=""
          fi
          # shellcheck disable=SC2086 # EXTRA is deliberately word-split
          gh release create "$TAG" $EXTRA \
            --title "valvur $VERSION" \
            --notes-file notes.md \
            "valvur-$VERSION.linux-amd64.cdx.json" \
            "valvur-$VERSION.linux-arm64.cdx.json" \
            "valvur-$VERSION.linux-amd64.spdx.json" \
            "valvur-$VERSION.linux-arm64.spdx.json" \
            dist/*

      - name: Remove the rehearsal's release and tag
        # `always()`: a rehearsal that failed halfway must not leave a draft behind
        # to be mistaken for a real one. The scratch image and the TestPyPI upload
        # stay, deliberately — they are the evidence the rehearsal produces.
        if: always() && env.REHEARSAL == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # A draft has no tag yet, so `--cleanup-tag` fails after the delete has
        # succeeded — the third rehearsal printed "no release to remove" for a draft
        # it had just removed. Delete the release and the tag separately, and report
        # each on its own evidence.
        run: |
          TAG="rehearsal-${GITHUB_RUN_NUMBER}"
          if gh release delete "$TAG" --yes 2>/dev/null; then
            echo "removed draft release $TAG"
          else
            echo "no release $TAG to remove"
          fi
          if git push --delete origin "$TAG" 2>/dev/null; then
            echo "removed tag $TAG"
          else
            echo "no tag $TAG to remove (a draft never creates one)"
          fi

      - name: Rehearsal report
        # One place that says what was and was not proven. A step allowed to
        # continue on failure still fails the rehearsal here — it was allowed to
        # continue so the steps after it could be exercised, not so it could pass.
        if: always() && env.REHEARSAL == 'true'
        env:
          TESTPYPI: ${{ steps.testpypi.outcome }}
        run: |
          {
            echo "## Rehearsal of release.yml"
            echo "- image: \`$IMAGE:$VERSION\` @ \`$DIGEST\`"
            echo "- attestation: made in stage, verified in artifact on both architectures"
            echo "- TestPyPI publish: $TESTPYPI, its attestation verified"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$TESTPYPI" != "success" ]; then
            echo "::error::TestPyPI publish outcome was '$TESTPYPI'. Configure the trusted publisher on test.pypi.org (docs/RELEASING.md) and rehearse again."
            exit 1
          fi
