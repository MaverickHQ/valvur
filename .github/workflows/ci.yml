name: ci

on:
  push:
    branches: [main]
  pull_request:

# Least privilege by default. We report this exact misconfiguration in other
# people's repositories (CKV2_GHA_1); shipping it in our own is the first thing a
# reviewer would notice.
permissions:
  contents: read

jobs:
  guard:
    # A pre-commit hook lives on one machine and dies to --no-verify. CI cannot be
    # bypassed, so this is the real enforcement of ADR-0011.
    name: no scan output in tree
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Refuse any committed scan output
        run: |
          if git ls-files | grep -E '(^|/)\.security-scan/'; then
            echo "::error::Scan output is committed. See docs/adr/0011-scan-output-never-enters-git.md"
            exit 1
          fi
          echo "clean: no .security-scan/ paths in the tree"

  test:
    name: lint, types, tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
      - run: uv venv --python 3.12

      - name: Lint, types, traceability, unit tests, package build
        # The same script a contributor runs locally (19.A.3). It is called rather
        # than duplicated on purpose: this job and release.yml previously carried
        # their own copies and drifted — CI linted `src tests`, release linted
        # `src tests scripts`, so four scripts were first checked on tag day (19.A.2).
        # Aligning two lists fixes that until the next edit; sharing one file fixes it.
        #
        # It installs from uv.lock with --locked, so a pyproject.toml change without a
        # matching `uv lock` fails here instead of resolving to whatever PyPI serves
        # that morning (19.A.1).
        run: ./scripts/verify.sh

  e2e:
    name: end-to-end (real container)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
      - uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1
      - name: Build image (version label drives the F1.9 compatibility check)
        run: |
          VER=$(grep -m1 '^version' pyproject.toml | cut -d'"' -f2)
          docker buildx build --load \
              --cache-from type=gha --cache-to type=gha,mode=max \
              --build-arg VALVUR_VERSION="$VER" -t valvur:dev .
      - name: Make the image visible to podman
        # Podman keeps its own image store, so a docker build is invisible to it.
        # Transferring is far cheaper than building twice, and without it the podman
        # tests would silently degrade to "scanner failed, zero findings".
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq podman
          docker save valvur:dev | podman load
      - run: uv venv --python 3.12
      - run: uv sync --extra dev --locked
      - name: Restore the package-name index between runs
        # ADR-0018: the first `valvur update` walks all of npm — 439 requests and
        # about five minutes, measured. Restored from the last run it is seconds.
        # Saved under a fresh key every run so the newest state is what the next
        # run restores; the cache has no way to update an existing key.
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/valvur/names
          key: valvur-name-index-${{ github.job }}-${{ github.run_id }}
          restore-keys: valvur-name-index-
      - name: Fetch the vulnerability database and the name index
        # The e2e canary asserts a COMPLETE run on `full`, which needs the database;
        # and since ADR-0018 the dependency-reality Check refuses to run offline
        # without the index. Neither was fetched here before 22.B.1 — this job had
        # not run since 2026-08-31, so nobody saw the canary fail for want of them.
        env:
          VALVUR_IMAGE: valvur:dev
        run: uv run valvur update
      - name: End-to-end, against the image just built
        # Without VALVUR_IMAGE the tests run against the published GHCR tag, which
        # this job did not build and cannot pull while the package is private
        # (task 12a.1). Every container test would fail on the pull.
        env:
          VALVUR_IMAGE: valvur:dev
        run: uv run pytest -q -m e2e
      - name: Runtime parity actually ran on both runtimes
        # The parity tests skip when a runtime has no local image. That is right
        # locally and wrong here: docker and podman both have it, so a skip means
        # the F1 dual-runtime claim went unverified while CI stayed green.
        # "Skipped" and "passed" must not look the same to a release gate.
        env:
          VALVUR_IMAGE: valvur:dev
        # Only the tests parametrised over runtimes are parity tests; a skip
        # elsewhere in the file is not what this guard is about (22.B.1).
        run: |
          uv run pytest -q tests/test_runtimes.py -k "docker or podman" -rs | tee parity.txt
          if grep -qE '[0-9]+ skipped' parity.txt; then
            echo "::error::Runtime parity tests were skipped. Dual-runtime support (F1) is unverified."
            exit 1
          fi
      - uses: sigstore/cosign-installer@d7543c93d881b35a8faa02e8e3605f69b7a1ce62 # v3.10.0
      - name: The Opengrep binaries are signed by Opengrep (15.2)
        # The Dockerfile pins their SHA256, which makes the build deterministic. That
        # is not the same as knowing where they came from — a pinned digest is only
        # as trustworthy as the download that produced it. This checks provenance,
        # and that the pin matches the artifact actually signed.
        run: sh scripts/verify-opengrep.sh

      - name: valvur adds no GPL component (F10.4)
        run: uv run python scripts/check_image_licences.py valvur:dev python:3.12-alpine3.22

  published:
    name: the published image, on amd64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6

      - name: Can an anonymous client even pull it?
        id: reachable
        # While the package is private (task 12a.1) this job cannot test anything.
        # It skips LOUDLY rather than passing: a skip that reads as a pass is exactly
        # how a single-arch image shipped unnoticed for a week.
        run: |
          VERSION=$(grep -m1 '^version' pyproject.toml | cut -d'"' -f2)
          echo "reachable=false" >> "$GITHUB_OUTPUT"

          TOKEN=$(curl -s "https://ghcr.io/token?scope=repository:maverickhq/valvur:pull&service=ghcr.io" \
            | python3 -c 'import json,sys; print(json.load(sys.stdin).get("token",""))' 2>/dev/null || true)
          if [ -z "$TOKEN" ]; then
            echo "::warning::ghcr.io/maverickhq/valvur is not publicly pullable (task 12a.1). The published artifact is UNVERIFIED on amd64."
            exit 0
          fi

          # Reachable is not the same as published. A release-prep commit bumps
          # pyproject.toml before the tag workflow pushes that version, so on main the
          # declared version legitimately does not exist yet — and inspecting it would
          # fail a PR for a reason that is nobody's fault (19.B.1). Gate on the tag,
          # not on the registry.
          CODE=$(curl -s -o /dev/null -w '%{http_code}' \
            -H "Authorization: Bearer $TOKEN" \
            -H 'Accept: application/vnd.oci.image.index.v1+json' \
            -H 'Accept: application/vnd.docker.distribution.manifest.list.v2+json' \
            "https://ghcr.io/v2/maverickhq/valvur/manifests/$VERSION")
          if [ "$CODE" = "200" ]; then
            echo "reachable=true" >> "$GITHUB_OUTPUT"
            echo "ghcr.io/maverickhq/valvur:$VERSION is published; verifying it"
          else
            echo "::notice::ghcr.io/maverickhq/valvur:$VERSION is not published yet (HTTP $CODE). Nothing to verify on this commit; release.yml verifies the artifact it pushes."
          fi

      - name: The published index must carry amd64
        if: steps.reachable.outputs.reachable == 'true'
        run: |
          VERSION=$(grep -m1 '^version' pyproject.toml | cut -d'"' -f2)
          docker manifest inspect "ghcr.io/maverickhq/valvur:$VERSION" > manifest.json
          python3 - <<'PY'
          import json, sys
          d = json.load(open("manifest.json"))
          got = {f"{m['platform']['os']}/{m['platform']['architecture']}"
                 for m in d.get("manifests", [])
                 if m.get("platform", {}).get("architecture") != "unknown"}
          missing = {"linux/amd64", "linux/arm64"} - got
          if missing:
              print(f"::error::published image is missing {sorted(missing)}; it advertises {sorted(got) or 'a single platform'}")
              sys.exit(1)
          print(f"published platforms: {sorted(got)}")
          PY

      - name: Restore the package-name index between runs
        # ADR-0018: the first `valvur update` walks all of npm — 439 requests and
        # about five minutes, measured. Restored from the last run it is seconds.
        # Saved under a fresh key every run so the newest state is what the next
        # run restores; the cache has no way to update an existing key.
        if: steps.reachable.outputs.reachable == 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/valvur/names
          key: valvur-name-index-${{ github.job }}-${{ github.run_id }}
          restore-keys: valvur-name-index-
      - name: Scan a real repository with the PUBLISHED image
        # This runner is amd64. Every other job builds the image locally, which always
        # matches the machine that made it — the reason nobody noticed the published
        # one was arm64-only. This job is the only thing pointed at what users get.
        if: steps.reachable.outputs.reachable == 'true'
        run: |
          VERSION=$(grep -m1 '^version' pyproject.toml | cut -d'"' -f2)
          uv venv --python 3.12
          uv sync --extra dev --locked
          export VALVUR_IMAGE="ghcr.io/maverickhq/valvur:$VERSION"
          uv run valvur update
          uv run valvur scan tests/fixtures/broken-repo --profile offline
          uv run python - <<'PY'
          import json, pathlib, sys
          run = json.loads(pathlib.Path("tests/fixtures/broken-repo/.security-scan/run.json").read_text())
          findings = json.loads(pathlib.Path("tests/fixtures/broken-repo/.security-scan/findings.json").read_text())["findings"]
          if not run.get("complete"):
              print("::error::the published image could not complete a scan on amd64")
              sys.exit(1)
          if len(findings) < 20:
              print(f"::error::only {len(findings)} findings from the published image; the fixture yields far more")
              sys.exit(1)
          print(f"published image scanned cleanly on amd64: {len(findings)} findings")
          PY

  selfscan:
    name: self-scan release gate (N2.5)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
      - uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1
      - name: Build image
        run: |
          VER=$(grep -m1 '^version' pyproject.toml | cut -d'"' -f2)
          docker buildx build --load \
              --cache-from type=gha --cache-to type=gha,mode=max \
              --build-arg VALVUR_VERSION="$VER" -t valvur:dev .
      - run: uv venv --python 3.12
      - run: uv sync --extra dev --locked
      - name: Restore the package-name index between runs
        # ADR-0018: the first `valvur update` walks all of npm — 439 requests and
        # about five minutes, measured. Restored from the last run it is seconds.
        # Saved under a fresh key every run so the newest state is what the next
        # run restores; the cache has no way to update an existing key.
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/valvur/names
          key: valvur-name-index-${{ github.job }}-${{ github.run_id }}
          restore-keys: valvur-name-index-
      - name: Fetch the vulnerability database and the name index
        env:
          VALVUR_IMAGE: valvur:dev
        run: uv run valvur update
      - name: Scan valvur with valvur
        env:
          VALVUR_IMAGE: valvur:dev
        run: uv run valvur scan . --profile full
      - name: Gate on the result
        # Three failure conditions, not one. The CLI exits zero when findings exist
        # (N3.2), so the gate reads the artifact rather than the exit code.
        run: |
          python3 - <<'EOF'
          import json, sys, pathlib

          results = pathlib.Path(".security-scan")
          findings = json.loads((results / "findings.json").read_text())["findings"]
          run = json.loads((results / "run.json").read_text())

          failures = []

          # 1. The scan must have completed. A Scanner that crashed makes "no
          #    findings" meaningless, and that is how a clean result gets faked.
          if not run.get("complete"):
              failures.append("a Scanner did not complete, so this result proves nothing")

          # 2. No unsuppressed findings (N2.5).
          live = [f for f in findings if not f.get("suppressed")]
          for f in live:
              failures.append(f"{f['severity']}: {f['rule']} in {f['path']} - {f['title']}")

          # 3. No expired suppressions. The lapse re-reports the finding, but if
          #    nothing fails the build then "mandatory expiry" is decoration.
          for f in findings:
              if f["rule"] in {"valvur.suppression.expired", "valvur.suppression.stale"}:
                  failures.append(f"{f['rule']}: {f['title']}")

          excluded = run.get("excluded_by_config", {})
          print(f"suppressed: {len(findings) - len(live)}  "
                f"excluded: {excluded.get('findings_dropped', 0)} "
                f"from {excluded.get('paths', [])}")

          if failures:
              for line in failures:
                  print(f"::error::{line}")
              sys.exit(1)
          print("self-scan clean: no unsuppressed findings, no expired suppressions")
          EOF
      - name: Refuse to leave scan output behind (ADR-0011)
        if: always()
        run: |
          if git status --porcelain | grep -E '\.security-scan/'; then
            echo "::error::Scan output is visible to git. The self-ignoring folder failed."
            exit 1
          fi
