name: index

# The published package-name index (task 23.2.1, ADR-0018): every name on PyPI, npm,
# RubyGems, Packagist and crates.io, built here once a day and pushed to GHCR as a
# signed OCI artifact — the `trivy-db` pattern. `valvur update` pulls it in seconds;
# without it every machine walks the five registries itself, which is about eight
# minutes and 550MB the first time.
#
# The daily build IS the fallback path, run by the same code: `python -m
# valvur.name_index build` is what `valvur update --build-index` calls. Then the
# artifact is pushed under a `candidate` tag, signed, pulled back with `python -m
# valvur.name_index pull` — the client every user runs, cosign included — and
# compared byte for byte with what was built; ONLY THEN is the verified digest
# tagged with the day and `latest` (task 27.0.1, the order of ADR-0020). Until
# 2026-09-21 the tags were written first and a build that failed its own round trip
# had already moved `latest`. Now a red run leaves `latest` where it was, and the
# `candidate` tag pointing at whatever failed, for reading. A day's tag is kept
# beside `latest` so a bad build can be pinned past.
#
# Freshness (ADR-0018): a scan reads an index over 30 days old as `inconclusive`,
# so a red day costs users nothing and a red month costs them the verdict. A
# dispatch from a branch builds the index and stops: nothing is pushed, signed or
# tagged off main.
on:
  schedule:
    - cron: "23 3 * * *"     # 03:23 UTC — crates.io's dump is cut at 02:00
  workflow_dispatch:

permissions:
  contents: read

env:
  REPOSITORY: ghcr.io/maverickhq/valvur-index

jobs:
  publish:
    name: build, push, sign, and pull it back
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      issues: write         # open the one issue a failure gets (27.2.7)
      packages: write       # push the artifact
      id-token: write       # keyless signing
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
      - uses: oras-project/setup-oras@1d808f7d7f6995cc68b7bf507bfe5c5446e1dc9d # v2.0.1
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - run: uv venv --python 3.12
      - run: uv sync --locked

      - name: Restore yesterday's index, so npm is walked from its change feed
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/valvur/names
          key: valvur-name-index-publish-${{ github.run_id }}
          restore-keys: valvur-name-index-publish-

      - name: Build the index from the registries
        run: |
          uv run python -m valvur.name_index build ~/.cache/valvur/names
          echo "## Built" >> "$GITHUB_STEP_SUMMARY"
          echo '```json' >> "$GITHUB_STEP_SUMMARY"
          cat ~/.cache/valvur/names/metadata.json >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Package the layers
        # One gzip layer per ecosystem file, `metadata.json` as the config blob.
        # The shim gunzips as it streams and checks each file is the sorted list
        # the reader bisects on; the workflow's job is only to compress.
        run: |
          set -eu
          mkdir -p artifact && cd artifact
          for f in pypi npm rubygems packagist crates; do
            test -s ~/.cache/valvur/names/$f.txt
            gzip -9 -n -c ~/.cache/valvur/names/$f.txt > $f.txt.gz
          done
          cp ~/.cache/valvur/names/metadata.json .
          ls -l

      - name: Push, under the candidate tag only
        # Not the date and not latest: neither exists until the round trip below
        # has verified this digest. `candidate` is one moving tag nobody resolves —
        # the shim's client refuses digest references for a moving index, so the
        # pull-back needs a tag to pull.
        id: push
        if: github.ref == 'refs/heads/main'
        run: |
          set -eu
          echo "${{ secrets.GITHUB_TOKEN }}" | oras login ghcr.io -u "${{ github.actor }}" --password-stdin
          DATE=$(date -u +%Y-%m-%d)
          cd artifact
          oras push "$REPOSITORY:candidate" \
            --artifact-type application/vnd.valvur.name-index.v1 \
            --config metadata.json:application/vnd.valvur.name-index.config.v1+json \
            --annotation "org.opencontainers.image.source=https://github.com/${{ github.repository }}" \
            --annotation "org.opencontainers.image.revision=${{ github.sha }}" \
            --annotation "org.opencontainers.image.description=valvur package-name index (ADR-0018)" \
            pypi.txt.gz:application/vnd.valvur.name-index.layer.v1+gzip \
            npm.txt.gz:application/vnd.valvur.name-index.layer.v1+gzip \
            rubygems.txt.gz:application/vnd.valvur.name-index.layer.v1+gzip \
            packagist.txt.gz:application/vnd.valvur.name-index.layer.v1+gzip \
            crates.txt.gz:application/vnd.valvur.name-index.layer.v1+gzip
          DIGEST=$(oras resolve "$REPOSITORY:candidate")
          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"
          echo "date=$DATE" >> "$GITHUB_OUTPUT"
          echo "pushed $REPOSITORY:candidate@$DIGEST"

      - name: Sign, keylessly
        # The same identity the image is signed under, and the same two values the
        # shim verifies against (`valvur.oci.SIGNING_IDENTITY`, `SIGNING_ISSUER`).
        # Signed by digest, so the signature holds through the re-tag below.
        if: github.ref == 'refs/heads/main'
        run: cosign sign --yes "${REPOSITORY}@${{ steps.push.outputs.digest }}"

      - name: Pull it back with the shim's own client, cosign included
        # The client every `valvur update` runs, against the candidate just pushed:
        # the manifest resolves to the digest that was pushed and signed, the
        # signature verifies under the workflow identity, every layer streams,
        # gunzips, passes the sorted-list check, and is byte for byte what was
        # built. If any of that fails, nothing has moved: `candidate` points at the
        # bad build, `latest` and every day's tag stand. The package went public on
        # 2026-09-13, so a pull that fails is a failure and not an expected skip.
        if: github.ref == 'refs/heads/main'
        env:
          VALVUR_INDEX_REPOSITORY: ${{ env.REPOSITORY }}:candidate
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          set -euo pipefail
          uv run python -m valvur.name_index pull /tmp/roundtrip
          for f in pypi npm rubygems packagist crates; do
            cmp ~/.cache/valvur/names/$f.txt /tmp/roundtrip/$f.txt
          done
          python3 - <<'PY'
          import json, os
          meta = json.load(open("/tmp/roundtrip/metadata.json"))
          for eco, entry in meta["ecosystems"].items():
              published = entry["published"]
              print(f"{eco}: {entry['count']:,} names, built {entry['built_at']}, "
                    f"signature {published['signature']}, digest {published['digest'][:19]}")
              assert published["signature"] == "verified", \
                  f"{eco}: the signature did not verify: {published['signature']}"
              assert published["digest"] == os.environ["DIGEST"], \
                  f"{eco}: the shim resolved {published['digest']}, not the digest pushed"
          PY

      - name: Tag the verified digest with today's date and latest
        # The one step users see. A manifest re-tag, so the digest — and the
        # signature on it — is exactly what the round trip verified.
        id: tag
        if: github.ref == 'refs/heads/main'
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
          DATE: ${{ steps.push.outputs.date }}
        run: |
          set -eu
          oras tag "$REPOSITORY@$DIGEST" "$DATE" latest
          for t in "$DATE" latest; do
            resolved=$(oras resolve "$REPOSITORY:$t")
            test "$resolved" = "$DIGEST" || { echo "::error::$REPOSITORY:$t resolves to $resolved, not $DIGEST"; exit 1; }
          done
          echo "tagged $REPOSITORY:$DATE and :latest @ $DIGEST"

      - name: Summary
        if: always()
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
          DATE: ${{ steps.push.outputs.date }}
          TAGGED: ${{ steps.tag.outcome }}
        run: |
          {
            if [ "$TAGGED" = "success" ]; then
              echo "## Published"
              echo
              echo "\`${REPOSITORY}:${DATE}\` = \`${REPOSITORY}:latest\` @ \`${DIGEST}\`"
            elif [ "${{ github.ref }}" != "refs/heads/main" ]; then
              echo "## Built, not published"
              echo
              echo "Dispatched from \`${{ github.ref }}\`: the index was built and nothing was pushed, signed or tagged."
            else
              echo "## Not published"
              echo
              echo "\`latest\` and every day's tag stand where they were. \`${REPOSITORY}:candidate\` @ \`${DIGEST:-not pushed}\` is the build that failed, for reading."
            fi
            echo
            echo '```bash'
            echo "cosign verify ${REPOSITORY}@${DIGEST} \\"
            echo "  --certificate-identity-regexp '^https://github.com/MaverickHQ/valvur/' \\"
            echo "  --certificate-oidc-issuer https://token.actions.githubusercontent.com"
            echo '```'
            echo
            du -sh artifact/* 2>/dev/null | sed 's/^/    /'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: A failure is a tracked thing, not an email
        # GitHub mails a scheduled failure to the workflow file's last committer and
        # does nothing else, so until task 27.2.7 the record of an index that stopped being rebuilt was one
        # person's inbox. One open issue per workflow: a second failure comments on
        # the first rather than filing another, because a job that has been broken
        # for a week is one problem, not seven.
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          TITLE: the daily name index stopped building
        run: |
          set -eu
          body=$(printf '%s\n\n%s\n\n%s\n' \
            "The scheduled \`index\` run failed: $RUN" \
            "Users keep the last published index: valvur update still pulls it and scans still answer from it. An index over thirty days old makes a nil result inconclusive rather than clean (ADR-0018), so a red day costs nothing and a red month costs the verdict." \
            "Recovery: re-run this workflow. Nothing is published until the round trip verifies the build, so a failed run left every tag where it was.")
          existing=$(gh issue list --state open --search "$TITLE in:title" \
                       --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "$body"
            echo "commented on #$existing"
          else
            gh issue create --title "$TITLE" --body "$body"
            echo "opened an issue"
          fi

