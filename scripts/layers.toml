# The host side in layers (D50). `scripts/check_layers.py` holds every module under
# `src/valvur` to one layer, and every import, deferred ones included, to a layer at or
# below its own. Modules are not moved: a module's layer is its line here.

# Lowest first: each layer imports only from itself and the layers before it.
order = ["core", "infra", "app", "surfaces"]

# Written by the build, never in the source tree (`compat` reads the tree's hash there).
generated = ["valvur._build"]

# The upward imports the check found on its first run (R23.2), by module. The list may
# only shrink: an entry that no longer happens fails until it is removed, and R23's
# exit empties it.
baseline = []

[layers]
# The Finding, identity, the verdict, ranking; the words and shapes everything else
# shares. No I/O beyond reading the package's own data.
core = [
    "valvur._build",
    "valvur.agent_rules",
    "valvur.agent_surfaces",
    "valvur.defang",
    "valvur.events",
    "valvur.findings",
    "valvur.fingerprint",
    "valvur.grouping",
    "valvur.invocation",
    "valvur.lazy",
    "valvur.licence_policy",
    "valvur.pathclass",
    "valvur.profiles",
    "valvur.project_schema",
    "valvur.ranking",
    "valvur.redact",
    "valvur.refusal",
    "valvur.scanner_run",
    "valvur.text",
    "valvur.verdict",
    "valvur.version",
    "valvur.versions",
]

