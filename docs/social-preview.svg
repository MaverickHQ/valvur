<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-label="valvur: offline security scanning for AI-generated code">
<!-- The repository's social preview (R39.4). scripts/social_preview.py renders it to
     docs/social-preview.png at 1280 by 640, which the owner uploads in Settings. -->
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#1e1f29"/>
    <stop offset="1" stop-color="#282a36"/>
  </linearGradient>
  <linearGradient id="mark" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#8be9fd"/>
    <stop offset="1" stop-color="#50fa7b"/>
  </linearGradient>
</defs>
<style>
  text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
  .name { font-size: 112px; font-weight: 700; fill: #f8f8f2; letter-spacing: -2px; }
  .line { font-size: 38px; font-weight: 600; fill: #f8f8f2; }
  .proof { font-size: 28px; fill: #8be9fd; }
  .chip { font-size: 22px; fill: #f8f8f2; }
  .foot { font-size: 22px; fill: #8b93b8; }
</style>
<rect width="1280" height="640" fill="url(#bg)"/>
<rect x="0" y="0" width="1280" height="8" fill="url(#mark)"/>

<g transform="translate(180 250)">
  <path d="M0 -112 L92 -80 L92 12 C92 76 48 116 0 136 C-48 116 -92 76 -92 12 L-92 -80 Z"
        fill="none" stroke="url(#mark)" stroke-width="12" stroke-linejoin="round"/>
  <path d="M-42 -6 L-8 34 L46 -44" fill="none" stroke="#f8f8f2" stroke-width="16"
        stroke-linecap="round" stroke-linejoin="round"/>
</g>

<text class="name" x="330" y="232">valvur</text>
<text class="line" x="334" y="300">Offline security scanning for AI-generated code</text>
<text class="proof" x="334" y="350">Your source never leaves your machine, and you can prove it.</text>

<g transform="translate(334 400)">
  <rect x="0" y="0" width="118" height="44" rx="22" fill="#343746"/>
  <text class="chip" x="59" y="29" text-anchor="middle">secrets</text>
  <rect x="132" y="0" width="182" height="44" rx="22" fill="#343746"/>
  <text class="chip" x="223" y="29" text-anchor="middle">dependencies</text>
  <rect x="328" y="0" width="262" height="44" rx="22" fill="#343746"/>
  <text class="chip" x="459" y="29" text-anchor="middle">hallucinated packages</text>
  <rect x="604" y="0" width="246" height="44" rx="22" fill="#343746"/>
  <text class="chip" x="727" y="29" text-anchor="middle">agent configuration</text>
  <rect x="0" y="58" width="196" height="44" rx="22" fill="#343746"/>
  <text class="chip" x="98" y="87" text-anchor="middle">infrastructure</text>
  <rect x="210" y="58" width="196" height="44" rx="22" fill="#343746"/>
  <text class="chip" x="308" y="87" text-anchor="middle">code (SAST)</text>
  <rect x="420" y="58" width="206" height="44" rx="22" fill="#343746"/>
  <text class="chip" x="523" y="87" text-anchor="middle">CI workflows</text>
</g>

<text class="foot" x="334" y="586">MCP server for Claude Code and Kiro  ·  CLI  ·  Apache-2.0  ·  github.com/MaverickHQ/valvur</text>
</svg>
