# valvur's own scan configuration — committed deliberately, reviewed on expiry.

# The dogfooding gate scans this repository. tests/fixtures holds deliberately
# vulnerable code: planted secrets, known-bad dependency manifests, prompt-injection
# payloads and hidden Unicode. It is the input our tests assert against, so it must
# stay exactly as broken as it is.
#
# Unexcluded it produced 61 of 64 self-scan findings, which makes the gate useless:
# a signal that is 95% intentional is not a signal. The scan still runs over it —
# this drops the findings and reports the count, so SUMMARY.md and run.json both say
# what was excluded and what it cost.
#
# This is a per-project decision in a committed file, never a built-in default.
# Skipping every project's tests would hide real code from the people who most need
# to see it.
[scan]
exclude = ["tests/fixtures", "tests/corpus/.checkouts"]

# valvur suppressions — committed deliberately, reviewed on expiry.
#
# Every entry needs a fingerprint, rule, path, expiry and reason. The expiry is
# mandatory by design: an accepted risk that never comes back up for review is an
# accepted risk nobody is accepting any more.
#
# CKV_DOCKER_2 is a Checkov rule that does not apply to a one-shot scanner image. It
# is not a defect to fix later — it is the rule being wrong about this container — so
# it carries a long expiry and a reason that says what would change the answer. The
# two beside it, for the Opengrep stage's ADD and its variable FROM, went with them
# in R27.3.

[[suppress]]
fingerprint = "0e2cb52a1e48b5c3e8507724afdc67b4"
rule = "CKV_DOCKER_2"
path = "Dockerfile"
expires = 2027-08-31
reason = "No HEALTHCHECK: this image runs one scanner command and exits. A healthcheck describes a long-running service, and Docker never runs one for a container that has already finished. Adding it would be cargo cult. Revisit if valvur ever ships a daemon or server mode."

# Checkov 3.3.17 (2026-09-14) — and 3.3.19 (2026-09-26) still — pulls in python-ecdsa, which carries an advisory with
# no fix and none coming. The lock's own self-scan found it the day the lock moved,
# which is what the lock is for; the decision is recorded here rather than by
# dropping the package from the lock, because a transitive import that fails at an
# unexpected moment is a failed Scanner, and that is worse than a known, reasoned
# acceptance that comes back up for review.

[[suppress]]
fingerprint = "294fda748b07bf2886edd3273e2c9956"
rule = "CVE-2024-23342"
path = "requirements-checkov.txt"
expires = 2027-09-14
reason = "python-ecdsa's Minerva timing side-channel (CVE-2024-23342) has no fix and will not get one — its maintainers state side-channel resistance is out of scope. It reaches this image only as a transitive dependency of Checkov, which never signs or verifies anything in a valvur scan: Checkov runs read-only over the workspace with no network on offline and no platform integration on full. A timing attack needs an attacker measuring signing operations; nothing here performs any. Revisit if Checkov moves off python-ecdsa, or if a scan ever exercises it."
